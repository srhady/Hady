name: Update Fancode BD Playlist

on:
  schedule:
    - cron: '0 */3 * * *' # প্রতি ৩ ঘণ্টা পর পর আপডেট হবে
  workflow_dispatch:      # ম্যানুয়ালি রান করার অপশন

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout content
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Generator Script
        run: python fancode_gen.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "Auto Bot"
          git config --global user.email "bot@github.com"
          git add fancode_bd.m3u
          git diff-index --quiet HEAD || (git commit -m "Updated BD Playlist" && git push)
