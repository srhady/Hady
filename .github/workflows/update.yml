name: Auto Update Playlist

on:
    workflow_dispatch:

jobs:
  scrape-live-matches:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 চেকআউট রিপোজিটরি
        uses: actions/checkout@v4

      - name: 🟢 Node.js সেটআপ
        uses: actions/setup-node@v4
        with:
          node-version: '20' # <--- শুধু এই লাইনটা 18 থেকে 20 করা হয়েছে!

      - name: 📦 ডিপেনডেন্সি ইনস্টল (Puppeteer & Cheerio)
        run: npm install

      - name: 🚀 স্ক্র্যাপার রান করা
        run: node scraper.js

      - name: 💾 প্লেলিস্ট গিটহাবে পুশ করা
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git commit -m "Auto Update Playlist: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || exit 0
          git push
