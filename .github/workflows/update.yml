name: Manual M3U Update

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Public Repository
        uses: actions/checkout@v4

      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: srhady/axsportspvt
          token: ${{ secrets.PAT_TOKEN }}
          path: private_repo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pywidevine pysocks

      - name: Execute Script
        run: |
          cp private_repo/akash.py .
          cp private_repo/device.wvd .
          python akash.py
          rm akash.py device.wvd

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add akash_live.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update M3U Playlist" && git push)
