ction">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
    firebase.initializeApp({apiKey:"AIzaSyDkV_pw1zfkzBAprnq2UGamFbA1defWPnY",authDomain:"livesportsplay-bc7f8.firebaseapp.com",databaseURL:"https://livesportsplay-bc7f8-default-rtdb.firebaseio.com",projectId:"livesportsplay-bc7f8",storageBucket:"livesportsplay-bc7f8.firebasestorage.app",messagingSenderId:"669238923994",appId:"1:669238923994:web:4f24e92be31f09677c0be3"});
    const db=firebase.database();

    const URL_1 = "https://raw.githubusercontent.com/srhady/data/refs/heads/main/live_sports_playlist.json";
    const URL_2 = "https://raw.githubusercontent.com/srhady/crichd-speical-live-event/refs/heads/main/Live_Events.json";
    const URL_3 = "https://raw.githubusercontent.com/srhady/join_telegram_chennal-livesportsplay/refs/heads/main/custom.json";
    
    let matchId = '';

    document.getElementById('randomViewers').innerText=(Math.random()*(50-10)+10).toFixed(1)+'k';
    const urlParams = new URLSearchParams(window.location.search);
    const matchSlugParam = urlParams.get('match');

    // ⏳ Loader 4 Seconds Logic
    let loaderTimeout;
    function triggerLoader() {
        const overlay = document.getElementById('streamLoaderOverlay');
        overlay.style.display = 'flex';
        overlay.style.opacity = '1';
        clearTimeout(loaderTimeout);
        loaderTimeout = setTimeout(() => {
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 500);
        }, 4000); // 6 সেকেন্ড থেকে কমিয়ে ৪ সেকেন্ড করা হলো
    }

    function generateMatchSlug(title) {
        return title.split('|')[0].trim().replace(/[^a-zA-Z0-9]/g,'-').toLowerCase();
    }

    if(!matchSlugParam) {
        window.location.href='index.html';
    } else {
        fetchMatchDataAndPlay();
    }

    // 🎯 The Dual Player Switcher Function
    function playStreamOnRightFrame(url) {
        triggerLoader();
        
        const playerWrapper = document.getElementById('mainPlayerWrapper');
        const defaultFrame = document.getElementById('streamFrameDefault');
        const crichdFrame = document.getElementById('streamFrameCrichd');

        // প্রথমে দুইটা ফ্রেমই অফ করে দাও
        defaultFrame.style.display = 'none';
        crichdFrame.style.display = 'none';
        defaultFrame.src = '';
        crichdFrame.src = '';

        if (url && (url.includes('dadocric') || url.includes('crichd'))) {
            // যদি লিংক CricHD এর হয়, তাহলে স্পেশাল হ্যাক করা ফ্রেমটা শো করো
            playerWrapper.classList.add('crichd-mode');
            crichdFrame.style.display = 'block';
            crichdFrame.src = url;
        } else {
            // অন্য যেকোনো লিংকের জন্য নরমাল ফ্রেমটা শো করো
            playerWrapper.classList.remove('crichd-mode');
            defaultFrame.style.display = 'block';
            defaultFrame.src = url;
        }
    }

    async function fetchMatchDataAndPlay() {
        try {
            let data1 = [], data2 = [], data3 = [];
            
            try {
                const [res1, res2, res3] = await Promise.all([
                    fetch(URL_1 + "?t=" + Date.now()).catch(() => null),
                    fetch(URL_2 + "?t=" + Date.now()).catch(() => null),
                    fetch(URL_3 + "?t=" + Date.now()).catch(() => null)
                ]);

                if(res1 && res1.ok) {
                    const d = await res1.json();
                    data1 = Array.isArray(d) ? d : (d.channels ? d.channels : []);
                }
                if(res2 && res2.ok) {
                    const d = await res2.json();
                    if (d.matches && Array.isArray(d.matches)) {
                        data2 = d.matches;
                    } else {
                        data2 = Array.isArray(d) ? d : [d]; 
                    }
                }
                if(res3 && res3.ok) {
                    const d = await res3.json();
                    if (d.matches && Array.isArray(d.matches)) {
                        data3 = d.matches;
                    } else {
                        data3 = Array.isArray(d) ? d : [d]; 
                    }
                }
            } catch(e) {}

            let mappedData1 = data1.map(item => {
                let title = item["Watch Title"] || item["Match Title"] || "Unknown";
                return {
                    "Category": item["Category"] || "Other",
                    "Match Title": title,
                    "Match Status": (item["Watch Status"] || item["Match Status"] || "live").toLowerCase(),
                    "Start Time": item["Start Time"] || "Streaming Now",
                    "Streams": item["Streams"] || []
                };
            });

            let mappedData2 = data2.map(item => {
                let channels = item["Channels"] || item["channels"] || [];
                return {
                    "Category": item["Category"] || item["category"] || "Cricket",
                    "Match Title": item["match name"] || "Live Cricket Match",
                    "Match Status": (item["Status"] || item["status"] || "live").toLowerCase(),
                    "Start Time": item["Start time"] || "Streaming Now",
                    "Streams": channels.map(ch => ({
                        "Embed_URL": ch["Embed link"] || ch["Stream link"],
                        "Language": ch["Channel name"],
                        "Quality": ch["Language"]
                    }))
                };
            });

            let mappedData3 = data3.map(item => {
                let statusStr = (item["Match Status"] || item["Status"] || item["status"] || "live").toLowerCase();
                let status = statusStr.includes("upcoming") ? "upcoming" : "live";
                let channels = item["Streams"] || item["Channels"] || item["channels"] || [];

                return {
                    "Category": item["Category"] || item["category"] || "Other",
                    "Match Title": item["Match Title"] || item["match name"] || "Live Match",
                    "Match Status": status,
                    "Start Time": item["Start Time"] || item["Start time"] || "Streaming Now",
                    "Streams": channels.map(ch => ({
                        "Embed_URL": ch["Embed_URL"] || ch["Embed link"] || ch["Stream link"],
                        "Language": ch["Language"] || ch["Channel name"],
                        "Quality": ch["Quality"] || ch["Language"] || "HD"
                    }))
                };
            });

            const allMatches = [...mappedData1, ...mappedData2, ...mappedData3];
            const matchBaseData = allMatches.find(m => generateMatchSlug(m['Match Title']) === matchSlugParam);
            
            if(!matchBaseData) {
                document.getElementById('mTitle').innerText="Match not found or ended!";
                return;
            }

            matchId = matchSlugParam;
            const shortTitle = matchBaseData['Match Title'].split('|')[0].trim();
            document.getElementById('mTitle').innerText = shortTitle;
            document.getElementById('mSport').innerHTML = `<i class="fa fa-trophy"></i> ${matchBaseData['Category'] || 'Sport'}`;

            const rawStatus = matchBaseData['Match Status'] || "";
            const status = rawStatus.replace(/🔴/g, '').replace(/⏳/g, '').trim().toLowerCase();
            const timeText = matchBaseData['Start Time'] || "Streaming Now";
            
            if(status.includes('live')) {
                document.getElementById('mTime').innerText = "Streaming Now";
            } else {
                document.getElementById('mTime').innerText = timeText;
                document.querySelector('.m-tag.live .dot').style.display='none';
                document.querySelector('.m-tag.live').style.background='rgba(252, 163, 17, 0.15)';
                document.querySelector('.m-tag.live').style.borderColor='rgba(252, 163, 17, 0.3)';
                document.querySelector('.m-tag.live').style.color='var(--accent-yellow)';
            }

            const streams = matchBaseData.Streams || [];
            const serverTabs = document.getElementById('serverTabs');

            if(streams.length > 0) {
                // ১ম লিংকের জন্য ফ্রেম সুইচ করো
                playStreamOnRightFrame(streams[0].Embed_URL);

                streams.forEach((stream, index) => {
                    const btn = document.createElement('div');
                    btn.className = `server-btn ${index === 0 ? 'active' : ''}`;
                    
                    let label = stream.Language || `Server ${index + 1}`;
                    if(stream.Quality && label !== stream.Quality) label += ` (${stream.Quality})`;

                    btn.innerHTML = `<i class="fa fa-play-circle"></i> ${label}`;
                    
                    btn.onclick = () => {
                        // সার্ভার পাল্টালে আবার সঠিক ফ্রেমে ভিডিও চালাও
                        playStreamOnRightFrame(stream.Embed_URL);
                        document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                    };
                    serverTabs.appendChild(btn);
                });
            } else {
                serverTabs.innerHTML = `<span style="font-size: 12px; color: #ff2a5f;"><i class="fa fa-info-circle"></i> No links available yet.</span>`;
            }

            initFirebaseChat();

        } catch(e) {
            document.getElementById('mTitle').innerText="Error loading stream data.";
        }
    }

    const chatBox=document.getElementById('chatMessages');
    function handleEnter(e){if(e.key==='Enter')postMessage();}
    function postMessage(){let name=document.getElementById('chatName').value.trim();const text=document.getElementById('chatText').value.trim();if(!text)return;if(!name)name="Guest";const newMsg={author:name,text:text,time:new Date().getTime()};db.ref('chats/'+matchId).push(newMsg);document.getElementById('chatText').value='';}
    let isFirstLoad=true;
    function initFirebaseChat(){db.ref('chats/'+matchId).limitToLast(100).on('value',snapshot=>{const data=snapshot.val();if(!data)return;const isScrolledToBottom=chatBox.scrollHeight-chatBox.clientHeight<=chatBox.scrollTop+50;chatBox.innerHTML='';Object.values(data).forEach(m=>{const timeStr=new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});const initial=m.author.charAt(0).toUpperCase();const colors=['#ff2a5f','#00f2fe','#00e676','#fca311','#b100ff'];const bgColor=colors[m.author.length%colors.length];const html=` <div class="msg-item"> <div class="msg-avatar" style="background: ${bgColor};">${initial}</div> <div class="msg-content"> <div class="msg-author">${m.author} <span class="msg-time">${timeStr}</span></div> <div class="msg-text">${m.text}</div> </div> </div> `;chatBox.insertAdjacentHTML('beforeend',html);});if(isFirstLoad||isScrolledToBottom){chatBox.scrollTop=chatBox.scrollHeight;isFirstLoad=false;}});}

    // 3-CLICK Adsterra Logic 
    let adClicks = 0;
    const maxClicks = 3;
    const adLink = "https://www.profitablecpmratenetwork.com/xpn6ymwsw2?key=fa95422004994fcfb18590e810849da7";
    
    document.getElementById('threeClickAd').addEventListener('click', function(e) {
        adClicks++;
        window.open(adLink, '_blank'); 
        if(adClicks >= maxClicks) {
            this.style.display = 'none'; 
        }
    });

</script>
