<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKASH GO - Master Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
    /* Reset & Base Styles */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b0f19; color: #e2e8f0; -webkit-font-smoothing: antialiased; }

    /* Login Screen */
    #login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: #0b0f19; }
    .login-box { background: #111827; border: 1px solid #1f2937; padding: 40px 32px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); text-align: center; }
    .login-box h2 { font-size: 26px; color: #f8fafc; margin-bottom: 8px; font-weight: 800; letter-spacing: -0.5px; }
    .login-box h2 span { color: #38bdf8; }
    .login-box p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
    .login-box input { width: 100%; padding: 14px 16px; background: #1f2937; border: 1px solid #374151; color: #f8fafc; border-radius: 10px; outline: none; margin-bottom: 16px; font-size: 15px; transition: all 0.2s ease; }
    .login-box input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1); }
    .login-box button { width: 100%; padding: 14px; background: #0284c7; color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; transition: background 0.2s ease; }
    .login-box button:hover { background: #0369a1; }
    #login-error { color: #ef4444; font-size: 13px; margin-bottom: 16px; display: none; font-weight: 500; }

    /* Dashboard Layout */
    #dashboard-screen { display: none; padding: 24px; max-width: 1400px; margin: 0 auto; }
    
    /* Header Section */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; border-bottom: 1px solid #1f2937; padding-bottom: 20px; }
    .header-title h1 { font-size: 22px; font-weight: 700; color: #f8fafc; letter-spacing: -0.5px; }
    .header-title p { font-size: 13px; color: #94a3b8; margin-top: 4px; }
    
    /* Stats Cards */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 32px; }
    .stat-card { background: #111827; border: 1px solid #1f2937; padding: 24px; border-radius: 16px; display: flex; flex-direction: column; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    .stat-label { font-size: 12px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
    .stat-value { font-size: 36px; font-weight: 700; color: #f8fafc; line-height: 1; }
    .value-highlight { color: #38bdf8; }
    .value-success { color: #10b981; }
    .value-danger { color: #ef4444; }

    /* Kill Switch Buttons */
    .kill-switch-container { display: flex; gap: 12px; align-items: center; }
    .btn-danger { background: #ef4444; color: white; padding: 10px 18px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px; }
    .btn-danger:hover { background: #dc2626; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2); }
    .btn-success { background: #10b981; color: white; padding: 10px 18px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: none; transition: all 0.2s; }
    .btn-success:hover { background: #059669; }

    /* Table Section */
    .table-container { background: #111827; border: 1px solid #1f2937; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    
    /* Custom Scrollbar for Table */
    .table-responsive::-webkit-scrollbar { height: 8px; }
    .table-responsive::-webkit-scrollbar-track { background: #0b0f19; }
    .table-responsive::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    .table-responsive::-webkit-scrollbar-thumb:hover { background: #4b5563; }

    table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
    th { background: #182132; padding: 16px 24px; font-size: 12px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #1f2937; }
    td { padding: 16px 24px; font-size: 14px; color: #cbd5e1; border-bottom: 1px solid #1f2937; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: #172133; }
    
    /* Typography & Badges */
    .ip-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; color: #f8fafc; font-weight: 500; font-size: 13px; }
    .channel-text { font-weight: 600; color: #f8fafc; }
    .time-text { color: #64748b; font-size: 12px; }
    
    .badge { display: inline-flex; align-items: center; justify-content: center; padding: 4px 12px; border-radius: 9999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .badge-pc { background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.2); }
    .badge-mobile { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
    
    /* Action Button */
    .action-btn { background: transparent; border: 1px solid rgba(239, 68, 68, 0.5); color: #ef4444; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .action-btn:hover { background: #ef4444; color: white; border-color: #ef4444; }

    @media (max-width: 640px) {
        .header { flex-direction: column; align-items: flex-start; gap: 20px; }
        .kill-switch-container { width: 100%; }
        .kill-switch-container button { width: 100%; justify-content: center; }
    }
</style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2>AKASH <span>GO</span></h2>
        <p>Master Administration Panel</p>
        <div id="login-error">Authentication failed. Please try again.</div>
        <input type="password" id="admin-pass" placeholder="Enter Secure Password">
        <button onclick="checkLogin()">AUTHORIZE ACCESS</button>
    </div>
</div>

<div id="dashboard-screen">
    <div class="header">
        <div class="header-title">
            <h1>System Radar</h1>
            <p>Real-time network & user activity monitoring</p>
        </div>
        <div class="kill-switch-container">
            <button id="btn-kill" class="btn-danger" onclick="triggerKillSwitch(false)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="15"></line><line x1="15" y1="9" x2="9" y2="15"></line></svg>
                EMERGENCY SHUTDOWN
            </button>
            <button id="btn-revive" class="btn-success" onclick="triggerKillSwitch(true)">RESTORE SYSTEM</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-label">Total Connections</span>
            <span class="stat-value" id="total-viewers">0</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Verified Viewers</span>
            <span class="stat-value value-highlight" id="tracked-viewers">0</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Server Status</span>
            <span class="stat-value value-success" id="sys-status">ONLINE</span>
        </div>
    </div>

    <div class="table-container">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>IP Address</th>
                        <th>Location</th>
                        <th>ISP / Network</th>
                        <th>Device Type</th>
                        <th>Current Channel</th>
                        <th>Timestamp</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="viewer-table-body">
                    <!-- Data populates here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
const ADMIN_PASS = "boss2026";

function checkLogin() {
    const input = document.getElementById('admin-pass').value;
    if (input === ADMIN_PASS) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard-screen').style.display = 'block';
        initFirebase();
    } else {
        document.getElementById('login-error').style.display = 'block';
    }
}

document.getElementById('admin-pass').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') checkLogin();
});

let db;
function initFirebase() {
    const firebaseConfig = {
        apiKey: "AIzaSyCpr-TpvEdpTVZXO2Ni3XftrxkcPl9Z5qs",
        authDomain: "akashgo-live.firebaseapp.com",
        databaseURL: "https://akashgo-live-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "akashgo-live",
        storageBucket: "akashgo-live.firebasestorage.app",
        messagingSenderId: "822141056550",
        appId: "1:822141056550:web:e6e056424ff3274a5c18e7"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    db = firebase.database();
    startMonitoring();
}

function startMonitoring() {
    db.ref('live_viewers').on('value', (snapshot) => {
        const data = snapshot.val();
        const tbody = document.getElementById('viewer-table-body');
        
        if (!data) {
            document.getElementById('total-viewers').innerText = "0";
            document.getElementById('tracked-viewers').innerText = "0";
            tbody.innerHTML = "<tr><td colspan='7' style='text-align:center; padding: 40px; color:#64748b;'>No active connections found.</td></tr>";
            return;
        }

        const keys = Object.keys(data);
        document.getElementById('total-viewers').innerText = keys.length;

        let validUsers = [];
        keys.forEach(key => {
            let rawUser = data[key];
            if (typeof rawUser === 'object' && rawUser !== null && rawUser.ip) {
                validUsers.push(rawUser);
            }
        });

        document.getElementById('tracked-viewers').innerText = validUsers.length;
        let rowsHtml = '';
        const displayUsers = validUsers.slice(-100).reverse();

        if (displayUsers.length === 0) {
            rowsHtml = "<tr><td colspan='7' style='text-align:center; padding: 40px; color:#64748b;'>Waiting for verified device telemetry...</td></tr>";
        } else {
            displayUsers.forEach(user => {
                let ip = user.ip || 'Unknown';
                let city = user.city || 'Unknown';
                let isp = user.isp || '-';
                let device = user.device || 'Active Device';
                let channel = user.channel || 'Browsing...';
                let time = user.time || '-';

                let deviceBadge = 'badge-mobile';
                if (device.includes('PC') || device.includes('Windows')) deviceBadge = 'badge-pc';

                rowsHtml += `
                    <tr>
                        <td class="ip-text">${ip}</td>
                        <td>${city}</td>
                        <td>${isp}</td>
                        <td><span class="badge ${deviceBadge}">${device}</span></td>
                        <td class="channel-text">${channel}</td>
                        <td class="time-text">${time}</td>
                        <td><button class="action-btn" onclick="blockIP('${ip}')">Terminate IP</button></td>
                    </tr>
                `;
            });
        }
        tbody.innerHTML = rowsHtml;
    });

    db.ref('site_status').on('value', (snapshot) => {
        const status = snapshot.val();
        const sysText = document.getElementById('sys-status');
        const btnKill = document.getElementById('btn-kill');
        const btnRevive = document.getElementById('btn-revive');

        if (status && status.online === false) {
            sysText.innerText = "OFFLINE";
            sysText.className = "stat-value value-danger";
            btnKill.style.display = 'none';
            btnRevive.style.display = 'inline-flex';
        } else {
            sysText.innerText = "ONLINE";
            sysText.className = "stat-value value-success";
            btnKill.style.display = 'inline-flex';
            btnRevive.style.display = 'none';
        }
    });
}

function blockIP(ip) {
    if (!ip || ip === 'Unknown') return alert("Invalid IP address.");
    if (confirm("TERMINATION PROTOCOL:\nAre you sure you want to block IP: " + ip + "?\nThis will instantly kill their video playback.")) {
        const safeIp = ip.replace(/\./g, '_');
        db.ref('blacklisted_ips/' + safeIp).set(true)
        .then(() => alert("IP Terminated successfully."))
        .catch(err => alert("Error: " + err.message));
    }
}

function triggerKillSwitch(turnOnline) {
    if (turnOnline) {
        if (confirm("Restore website access to all users?")) {
            db.ref('site_status').set({ online: true });
        }
    } else {
        const msg = prompt("EMERGENCY SHUTDOWN PROTOCOL\nEnter public maintenance message:", "Scheduled maintenance is in progress. Please check back later.");
        if (msg !== null) {
            db.ref('site_status').set({ 
                online: false, 
                title: "SYSTEM OFFLINE", 
                msg: msg 
            });
        }
    }
}
</script>
</body>
</html>
