<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKASH GO - Admin Control Center</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { background-color: #050508; color: #fff; }
#login-screen { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #0a0a0f; }
.login-box { background: #1a1a24; padding: 40px; border-radius: 12px; border: 1px solid #2a2a35; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 400px; }
.login-box h2 { color: #00a0e3; margin-bottom: 20px; font-style: italic; font-weight: 900; }
.login-box h2 span { background: #e31837; color: #fff; padding: 2px 8px; border-radius: 8px; font-style: normal; font-size: 16px; }
.login-box input { width: 100%; padding: 12px 15px; margin-bottom: 20px; background: #050508; border: 1px solid #2a2a35; color: #fff; border-radius: 8px; outline: none; }
.login-box button { width: 100%; padding: 12px; background: #00a0e3; border: none; color: #fff; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
.login-box button:hover { background: #0088c2; }
#login-error { color: #e31837; font-size: 13px; margin-bottom: 15px; display: none; }
#dashboard-screen { display: none; padding: 20px; max-width: 1400px; margin: 0 auto; }
.header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #1a1a24; margin-bottom: 20px; }
.header h1 { color: #00e676; font-size: 24px; }
.stats-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
.card { background: #1a1a24; border: 1px solid #2a2a35; padding: 20px; border-radius: 12px; text-align: center; }
.card h3 { color: #aaa; font-size: 13px; margin-bottom: 10px; text-transform: uppercase; }
.card .value { font-size: 32px; font-weight: bold; }
.kill-switch-container { display: flex; gap: 15px; align-items: center; }
.btn-kill { background: #e31837; color: #fff; padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px rgba(227, 24, 55, 0.4); transition: 0.3s; }
.btn-kill:hover { background: #c2122c; transform: scale(1.05); }
.btn-revive { background: #00e676; color: #111; padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: none; }
.table-container { background: #1a1a24; border: 1px solid #2a2a35; border-radius: 12px; overflow-x: auto; max-height: 70vh; }
table { width: 100%; border-collapse: collapse; text-align: left; }
th, td { padding: 15px; border-bottom: 1px solid #2a2a35; font-size: 14px; }
th { background: #0a0a0f; color: #aaa; text-transform: uppercase; font-size: 12px; position: sticky; top: 0; z-index: 10; }
tr:hover { background: rgba(0, 160, 227, 0.1); }
.badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
.badge-pc { background: rgba(0, 160, 227, 0.1); color: #00a0e3; border: 1px solid #00a0e3; }
.badge-mobile { background: rgba(0, 230, 118, 0.1); color: #00e676; border: 1px solid #00e676; }
.btn-block { background: transparent; border: 1px solid #e31837; color: #e31837; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; }
.btn-block:hover { background: #e31837; color: #fff; }
@media (max-width: 768px) { .stats-cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2>AKASH <span>GO</span></h2>
        <p style="color: #aaa; margin-bottom: 20px; font-size: 14px;">Master Control Center</p>
        <div id="login-error">Incorrect Password! Access Denied.</div>
        <input type="password" id="admin-pass" placeholder="Enter Admin Password">
        <button onclick="checkLogin()">AUTHORIZE ACCESS</button>
    </div>
</div>

<div id="dashboard-screen">
    <div class="header">
        <h1>Live Monitoring Radar</h1>
        <div class="kill-switch-container">
            <button id="btn-kill" class="btn-kill" onclick="triggerKillSwitch(false)">EMERGENCY SHUTDOWN</button>
            <button id="btn-revive" class="btn-revive" onclick="triggerKillSwitch(true)">RESTORE WEBSITE</button>
        </div>
    </div>

    <div class="stats-cards">
        <div class="card">
            <h3>Total Viewers (All)</h3>
            <div class="value" id="total-viewers" style="color: #fff;">0</div>
        </div>
        <div class="card">
            <h3>Tracked Viewers (New Update)</h3>
            <div class="value" id="tracked-viewers" style="color: #00a0e3;">0</div>
        </div>
        <div class="card">
            <h3>System Status</h3>
            <div class="value" id="sys-status" style="color: #00e676;">ONLINE</div>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>IP Address</th>
                    <th>Location</th>
                    <th>ISP / Network</th>
                    <th>Device</th>
                    <th>Current Channel</th>
                    <th>Time Joined</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="viewer-table-body"></tbody>
        </table>
    </div>
</div>

<script>
const ADMIN_PASS = "boss2026";

function checkLogin() {
    const input = document.getElementById('admin-pass').value;
    if (input === ADMIN_PASS) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard-screen').style.display = 'block';
        initFirebase();
    } else {
        document.getElementById('login-error').style.display = 'block';
    }
}

document.getElementById('admin-pass').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') checkLogin();
});

let db;
function initFirebase() {
    const firebaseConfig = {
        apiKey: "AIzaSyCpr-TpvEdpTVZXO2Ni3XftrxkcPl9Z5qs",
        authDomain: "akashgo-live.firebaseapp.com",
        databaseURL: "https://akashgo-live-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "akashgo-live",
        storageBucket: "akashgo-live.firebasestorage.app",
        messagingSenderId: "822141056550",
        appId: "1:822141056550:web:e6e056424ff3274a5c18e7"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    db = firebase.database();
    startMonitoring();
}

function startMonitoring() {
    db.ref('live_viewers').on('value', (snapshot) => {
        const data = snapshot.val();
        const tbody = document.getElementById('viewer-table-body');
        
        if (!data) {
            document.getElementById('total-viewers').innerText = "0";
            document.getElementById('tracked-viewers').innerText = "0";
            tbody.innerHTML = "<tr><td colspan='7' style='text-align:center; color:#aaa;'>No active viewers right now.</td></tr>";
            return;
        }

        const keys = Object.keys(data);
        document.getElementById('total-viewers').innerText = keys.length;

        let validUsers = [];
        keys.forEach(key => {
            let rawUser = data[key];
            // Filter out old legacy users who only send 'true'
            if (typeof rawUser === 'object' && rawUser !== null && rawUser.ip) {
                validUsers.push(rawUser);
            }
        });

        document.getElementById('tracked-viewers').innerText = validUsers.length;

        let rowsHtml = '';
        
        // Show only the actual tracked users (limit to 100 to prevent crashing)
        const displayUsers = validUsers.slice(-100).reverse();

        if (displayUsers.length === 0) {
            rowsHtml = "<tr><td colspan='7' style='text-align:center; color:#aaa;'>No detailed tracking data available yet. Waiting for users to refresh...</td></tr>";
        } else {
            displayUsers.forEach(user => {
                let ip = user.ip || 'Unknown';
                let city = user.city || 'Unknown';
                let isp = user.isp || '-';
                let device = user.device || 'Active Device';
                let channel = user.channel || 'Browsing...';
                let time = user.time || '-';

                let deviceBadge = 'badge-mobile';
                if (device.includes('PC') || device.includes('Windows')) deviceBadge = 'badge-pc';

                rowsHtml += `
                    <tr>
                        <td style="color: #00a0e3; font-family: monospace;">${ip}</td>
                        <td>${city}</td>
                        <td style="color: #aaa;">${isp}</td>
                        <td><span class="badge ${deviceBadge}">${device}</span></td>
                        <td style="font-weight: bold;">${channel}</td>
                        <td style="color: #aaa; font-size: 12px;">${time}</td>
                        <td><button class="btn-block" onclick="blockIP('${ip}')">BLOCK IP</button></td>
                    </tr>
                `;
            });
        }
        
        tbody.innerHTML = rowsHtml;
    });

    db.ref('site_status').on('value', (snapshot) => {
        const status = snapshot.val();
        const sysText = document.getElementById('sys-status');
        const btnKill = document.getElementById('btn-kill');
        const btnRevive = document.getElementById('btn-revive');

        if (status && status.online === false) {
            sysText.innerText = "OFFLINE (SHUTDOWN)";
            sysText.style.color = "#e31837";
            btnKill.style.display = 'none';
            btnRevive.style.display = 'block';
        } else {
            sysText.innerText = "ONLINE & SECURE";
            sysText.style.color = "#00e676";
            btnKill.style.display = 'block';
            btnRevive.style.display = 'none';
        }
    });
}

function blockIP(ip) {
    if (!ip || ip === 'Anonymous User' || ip === 'Unknown') return alert("Cannot block an unknown IP.");
    if (confirm("Are you sure you want to BLOCK this IP: " + ip + "?\nThey will be immediately kicked out of the website.")) {
        const safeIp = ip.replace(/\./g, '_');
        db.ref('blacklisted_ips/' + safeIp).set(true)
        .then(() => {
            alert("IP Blocked successfully! Target neutralized.");
        })
        .catch(err => alert("Error: " + err.message));
    }
}

function triggerKillSwitch(turnOnline) {
    if (turnOnline) {
        if (confirm("Are you sure you want to restore the website? Users will be able to watch again.")) {
            db.ref('site_status').set({ online: true });
        }
    } else {
        const msg = prompt("EMERGENCY SHUTDOWN INITIATED.\nEnter a maintenance message for users:", "Server is down for a security update. Please check back later.");
        if (msg !== null) {
            db.ref('site_status').set({ 
                online: false, 
                title: "SYSTEM OFFLINE", 
                msg: msg 
            });
        }
    }
}
</script>
</body>
</html>
