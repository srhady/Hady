<html lang="en">

  <style>
    :root { --bg-main: #0c121a; --bg-card: #17202c; --bg-pill: #121923; --sky-primary: #38bdf8; --sky-border: #0284c7; --sky-bright: #38bdf8; --pill-active-start: #0284c7; --pill-active-end: #0369a1; --text-white: #ffffff; --text-muted: #93a3b5; --live-green: #22c55e; --badge-red: #e52521; --hot-green: #1db954; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: #070b10; color: var(--text-white); font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; user-select: none; }
    .app-container { width: 100%; max-width: 450px; min-height: 100vh; background-color: var(--bg-main); padding-bottom: 24px; position: relative; box-shadow: 0 0 35px rgba(0, 0, 0, 0.8); }
    .app-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background-color: var(--bg-main); border-bottom: 1px solid #192434; position: sticky; top: 0; z-index: 50; }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .menu-btn { background: none; border: none; color: #b8c4d2; display: flex; align-items: center; cursor: pointer; }
    .brand-title { font-size: 20px; font-weight: 600; letter-spacing: 0.3px; color: #ffffff; }
    .header-right { display: flex; align-items: center; gap: 18px; }
    .icon-btn { background: none; border: none; color: #ffffff; position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .notif-badge { position: absolute; top: -6px; right: -6px; background-color: var(--badge-red); color: #fff; font-size: 10px; font-weight: 700; min-width: 17px; height: 17px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 0 3px; }
    .spinning svg { animation: spin 0.7s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .search-drawer { display: none; padding: 6px 10px 2px; }
    .search-drawer.open { display: block; }
    .search-inner { display: flex; align-items: center; background-color: #131c27; border: 2px solid var(--sky-primary); border-radius: 20px; padding: 6px 12px; }
    .search-inner input { width: 100%; background: transparent; border: none; outline: none; color: #ffffff; font-size: 13px; font-family: inherit; }
    .search-inner input::placeholder { color: #7b8da3; }
    .search-clear { background: none; border: none; color: #93a3b5; font-size: 16px; cursor: pointer; padding-left: 6px; }
    .notice-bar { margin: 10px 10px 8px; height: 34px; background-color: #131b25; border: 2px solid var(--sky-primary); border-radius: 9px; display: flex; align-items: center; padding: 0 10px; overflow: hidden; }
    .notice-icon { flex-shrink: 0; margin-right: 8px; display: flex; align-items: center; }
    .marquee-wrap { overflow: hidden; white-space: nowrap; width: 100%; }
    .marquee-text { display: inline-block; font-size: 13.5px; font-weight: 500; color: #f1f5f9; white-space: nowrap; animation: marquee 20s linear infinite; }
    @keyframes marquee { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }
    .sports-slider { display: flex; align-items: center; gap: 9px; padding: 2px 10px 8px; overflow-x: auto; scrollbar-width: none; }
    .sports-slider::-webkit-scrollbar { display: none; }
    .sport-box { width: 52px; height: 52px; border-radius: 12px; background-color: #151e2b; border: 2px solid #1d2a3b; display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; cursor: pointer; transition: border-color 0.15s ease, background-color 0.15s ease; }
    .sport-box.active { border: 2px solid var(--sky-primary); background-color: #182435; box-shadow: 0 0 8px rgba(56, 189, 248, 0.25); }
    .sport-badge { position: absolute; top: 3px; right: 3px; background-color: var(--badge-red); color: #fff; font-size: 9.5px; font-weight: 700; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; display: flex; align-items: center; justify-content: center; line-height: 1; }
    .filter-slider { display: flex; align-items: center; gap: 8px; padding: 2px 10px 10px; overflow-x: auto; scrollbar-width: none; }
    .filter-slider::-webkit-scrollbar { display: none; }
    .filter-pill { height: 35px; padding: 0 13px; border-radius: 20px; background-color: var(--bg-pill); border: 2px solid var(--sky-border); color: var(--text-white); font-size: 13.5px; font-weight: 500; display: flex; align-items: center; gap: 7px; white-space: nowrap; flex-shrink: 0; cursor: pointer; font-family: inherit; }
    .filter-pill.active { background: linear-gradient(90deg, var(--pill-active-start) 0%, var(--pill-active-end) 100%); border: 2px solid var(--sky-primary); box-shadow: 0 0 8px rgba(56, 189, 248, 0.25); }
    .filter-pill .pill-icon { display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; }
    .matches-list { padding: 0 10px; display: flex; flex-direction: column; gap: 9px; }
    .match-card { background-color: var(--bg-card); border: 2px solid var(--sky-primary); border-radius: 14px; padding: 5px 10px 0; position: relative; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; min-height: 104px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.32); }
    .card-header { display: flex; align-items: center; justify-content: center; gap: 6px; height: 17px; }
    .league-icon { width: 15px; height: 15px; object-fit: contain; flex-shrink: 0; }
    .league-title { font-size: 11.5px; font-weight: 700; color: #ffffff; text-transform: uppercase; letter-spacing: 0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 88%; }
    .card-body { display: grid; grid-template-columns: 1fr 82px 1fr; align-items: center; margin: 2px 0; gap: 4px; }
    .team-side { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .team-side.right { justify-content: flex-end; }
    .team-logo-wrap { width: 48px; height: 48px; border-radius: 50%; background-color: #101720; border: 2px solid #2e435c; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; padding: 0; }
    .team-logo-wrap img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
    .team-name { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; color: #ffffff; line-height: 1.15; white-space: normal; word-break: break-word; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .team-side.right .team-name { text-align: right; }
    .center-info { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .live-indicator { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .live-dot { width: 6px; height: 6px; background-color: var(--live-green); border-radius: 50%; box-shadow: 0 0 7px var(--live-green); animation: blink 1.1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.85); } }
    .live-text { font-size: 11px; font-weight: 700; color: var(--live-green); letter-spacing: 0.2px; }
    .match-time { font-size: 12.5px; font-weight: 700; color: var(--sky-bright); line-height: 1.2; }
    .match-date { font-size: 10.5px; font-weight: 500; color: var(--text-muted); margin-top: 1px; }
    .card-footer { display: flex; align-items: flex-end; justify-content: center; position: relative; height: 21px; }
    .hot-ribbon { position: absolute; left: -10px; bottom: 0; background-color: var(--hot-green); color: #ffffff; font-size: 10px; font-weight: 700; padding: 2px 11px 2px 9px; border-top-right-radius: 10px; display: flex; align-items: center; gap: 3px; }
    .bottom-status-tab { background-color: #0e141d; color: #ffffff; font-size: 11px; font-weight: 600; padding: 2px 15px; border-radius: 8px 8px 0 0; letter-spacing: 0.2px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  <script>
    const API_URL = 'https://falconde-uqdj3fde.manus.space/api/geesports/events';
    const UTC_PLUS_6_MS = 6 * 60 * 60 * 1000;

    function sanitizeLogoUrl(url) {
      if (!url || typeof url !== 'string') return '';
      let clean = url.trim();
      return clean.startsWith('http://') ? 'https://' + clean.slice(7) : clean;
    }

    function createFallbackBadge(name) {
      const clean = (name || 'DL').replace(/[^a-zA-Z0-9 ]/g, '').trim();
      const initials = clean.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || 'DL';
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96"><rect width="96" height="96" rx="48" fill="#101720"/><text x="48" y="56" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="700">${initials}</text></svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    window.onLogoError = function(img, label) {
      const raw = img.getAttribute('data-raw') || img.src;
      const proxied = img.getAttribute('data-proxied');
      if (!proxied && raw && raw.startsWith('http')) {
        img.setAttribute('data-proxied', '1');
        img.src = `https://wsrv.nl/?url=${encodeURIComponent(raw)}&w=96&h=96&fit=cover&output=webp`;
      } else {
        img.onerror = null;
        img.src = createFallbackBadge(label);
      }
    };

      { id: 'live', label: 'Live', icon: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="2" fill="#22c55e"/><path d="M8.5 8.5a5 5 0 0 0 0 7"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M5.5 5.5a9 9 0 0 0 0 13"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>` },
      { id: 'upcoming', label: 'Upcoming', icon: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><path d="M12 2v4M4.93 4.93l2.83 2.83M2 12h4M19.07 4.93l-2.83 2.83M18 12h4"/><path d="M5 16h14v4H5z"/></svg>` },
      { id: 'today', label: "Today's", icon: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>` },
      { id: 'tomorrow', label: 'Tomorrow', icon: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="m10 14 2 2 4-4"/></svg>` },
      { id: 'finished', label: 'Finished', icon: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>` }
    ];

    function parseUtcMillis(dateStr, timeStr) {
      if (!dateStr || !timeStr) return null;
      const dParts = dateStr.trim().split('/').map(Number), tParts = timeStr.trim().split(':').map(Number);
      if (dParts.length !== 3 || isNaN(dParts[0]) || isNaN(dParts[1]) || isNaN(dParts[2])) return null;
      const [day, month, year] = dParts, [hour = 0, minute = 0, second = 0] = tParts;
      return Date.UTC(year, month - 1, day, hour, minute, second);
    }

    function formatUtcPlus6(utcMs) {
      const bdDate = new Date(utcMs + UTC_PLUS_6_MS);
      const dd = String(bdDate.getUTCDate()).padStart(2, '0'), mm = String(bdDate.getUTCMonth() + 1).padStart(2, '0'), yyyy = bdDate.getUTCFullYear();
      const hours24 = bdDate.getUTCHours(), minutes = String(bdDate.getUTCMinutes()).padStart(2, '0'), ampm = hours24 >= 12 ? 'PM' : 'AM', hours12 = String(hours24 % 12 || 12).padStart(2, '0');
      return { dateStr: `${dd}/${mm}/${yyyy}`, time12Str: `${hours12}:${minutes} ${ampm}`, dayKey: `${yyyy}-${mm}-${dd}` };
    }

    function getBdDayKey(utcMs) {
      const bdDate = new Date(utcMs + UTC_PLUS_6_MS);
      return `${bdDate.getUTCFullYear()}-${String(bdDate.getUTCMonth() + 1).padStart(2, '0')}-${String(bdDate.getUTCDate()).padStart(2, '0')}`;
    }

    function computeEventTiming(rawEv) {
      let startUtc = parseUtcMillis(rawEv.date, rawEv.time);
      let endUtc = parseUtcMillis(rawEv.end_date || rawEv.date, rawEv.end_time || '23:59:00');
      if (!startUtc) startUtc = Date.now() - 1800 * 1000;
      if (!endUtc || endUtc <= startUtc) endUtc = endUtc && endUtc <= startUtc ? endUtc + 24 * 3600 * 1000 : startUtc + 3 * 3600 * 1000;
      const bdFormatted = formatUtcPlus6(startUtc);
      return {
        category: (rawEv.category || 'Sports').trim(), eventName: (rawEv.eventName || 'Match').trim(), eventLogo: sanitizeLogoUrl(rawEv.eventLogo),
        teamAName: (rawEv.teamAName || 'Team A').trim(), teamBName: (rawEv.teamBName || 'Team B').trim(), teamAFlag: sanitizeLogoUrl(rawEv.teamAFlag), teamBFlag: sanitizeLogoUrl(rawEv.teamBFlag),
        startUtc, endUtc, bdTime12: bdFormatted.time12Str, bdDate: bdFormatted.dateStr, bdDayKey: bdFormatted.dayKey,
        priority: Number(rawEv.priority ?? -1), isHot: Boolean(rawEv.isHot || Number(rawEv.priority) > 0),
        link_names: Array.isArray(rawEv.link_names) && rawEv.link_names.length > 0 ? rawEv.link_names : ['STREAM TV + HD']
      };
    }

    function getMatchLiveState(ev, nowMs = Date.now()) {
      if (nowMs >= ev.startUtc && nowMs <= ev.endUtc) return 'live';
      return nowMs > ev.endUtc ? 'finished' : 'upcoming';
    }

    function matchesStatusTab(ev, tabId, nowMs = Date.now()) {
      const state = getMatchLiveState(ev, nowMs), todayKey = getBdDayKey(nowMs), tomorrowKey = getBdDayKey(nowMs + 24 * 3600 * 1000);
      if (tabId === 'all') return true;
      if (tabId === 'live') return state === 'live';
      if (tabId === 'upcoming') return state === 'upcoming';
      if (tabId === 'finished') return state === 'finished';
      if (tabId === 'today') return state === 'live' || (ev.bdDayKey === todayKey && state !== 'finished');
      if (tabId === 'tomorrow') return state === 'upcoming' && ev.bdDayKey === tomorrowKey;
      return true;
    }

    function formatTickingDuration(totalSeconds, isUpcoming = false) {
      const sec = Math.max(0, Math.floor(totalSeconds)), days = Math.floor(sec / 86400), hours = Math.floor((sec % 86400) / 3600), minutes = Math.floor((sec % 3600) / 60), seconds = sec % 60;
      const mm = String(minutes).padStart(2, '0'), ss = String(seconds).padStart(2, '0');
      if (days > 0) return `${days}d ${String(hours).padStart(2, '0')}:${mm}:${ss}`;
      return (isUpcoming && hours === 0) ? `${mm}:${ss}` : `${hours}:${mm}:${ss}`;
    }

    function formatElapsedDuration(elapsedSeconds) {
      const sec = Math.max(0, Math.floor(elapsedSeconds)), hours = Math.floor(sec / 3600), minutes = Math.floor((sec % 3600) / 60), seconds = sec % 60;
      return `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function getCardBottomStatusText(ev, nowMs = Date.now()) {
      const state = getMatchLiveState(ev, nowMs);
      if (state === 'finished') return 'Match Ended';
      if (state === 'live') return formatElapsedDuration((nowMs - ev.startUtc) / 1000);
      return `Match Starting in ${formatTickingDuration((ev.startUtc - nowMs) / 1000, true)}`;
    }

    function matchesSportCategory(ev, sportKey) {
      if (sportKey === 'ALL') return true;
      const cat = (ev.category || '').toLowerCase(), evt = (ev.eventName || '').toLowerCase();
      if (sportKey === 'cricket') return cat.includes('cricket') || evt.includes('cricket') || evt.includes('ipl') || evt.includes('t20');
      if (sportKey === 'football') return cat.includes('football') || cat.includes('soccer');
      if (sportKey === 'boxing') return ['boxing', 'mma', 'ufc', 'wrestling', 'fight'].some(k => cat.includes(k) || evt.includes(k));
      if (sportKey === 'motorsport') return ['motor', 'gp', 'formula', 'f1', 'racing', 'nascar'].some(k => cat.includes(k) || evt.includes(k));
      return cat.includes(sportKey);
    }

    function getSportFilteredEvents() {
      return allEvents.filter(ev => {
        if (!matchesSportCategory(ev, selectedSport)) return false;
        if (searchQuery) {
          const hay = `${ev.teamAName} ${ev.teamBName} ${ev.eventName} ${ev.category}`.toLowerCase();
          if (!hay.includes(searchQuery.toLowerCase())) return false;
        }
        return true;
      });
    }

    function renderSportBoxes() {
      const container = document.getElementById('sportSlider');
      const counts = {
        ALL: allEvents.length,
        cricket: allEvents.filter(e => matchesSportCategory(e, 'cricket')).length,
        football: allEvents.filter(e => matchesSportCategory(e, 'football')).length,
        boxing: allEvents.filter(e => matchesSportCategory(e, 'boxing')).length,
        motorsport: allEvents.filter(e => matchesSportCategory(e, 'motorsport')).length
      };
      container.innerHTML = SPORT_ICONS.map(sp => `<div class="sport-box ${selectedSport === sp.matchKey ? 'active' : ''}" onclick="selectSport('${sp.matchKey}')">${sp.svg}<span class="sport-badge">${counts[sp.matchKey]}</span></div>`).join('');
    }

    function renderStatusPills() {
      const container = document.getElementById('statusSlider'), nowMs = Date.now(), sportList = getSportFilteredEvents();
      const counts = {
        all: sportList.length,
        live: sportList.filter(e => matchesStatusTab(e, 'live', nowMs)).length,
        upcoming: sportList.filter(e => matchesStatusTab(e, 'upcoming', nowMs)).length,
        today: sportList.filter(e => matchesStatusTab(e, 'today', nowMs)).length,
        tomorrow: sportList.filter(e => matchesStatusTab(e, 'tomorrow', nowMs)).length,
        finished: sportList.filter(e => matchesStatusTab(e, 'finished', nowMs)).length
      };
      document.getElementById('notifCountBadge').textContent = counts.live || counts.all || 9;
      container.innerHTML = STATUS_TABS.map(tab => {
        const isActive = selectedStatus === tab.id;
        return `<button class="filter-pill ${isActive ? 'active' : ''}" onclick="selectStatus('${tab.id}')"><span class="pill-icon">${isActive ? CHECK_ICON_SVG : tab.icon}</span><span>${tab.label} (${counts[tab.id]})</span></button>`;
      }).join('');
    }

    function renderMatches() {
      const listEl = document.getElementById('matchesList'), nowMs = Date.now();
      let list = getSportFilteredEvents().filter(ev => matchesStatusTab(ev, selectedStatus, nowMs));
      list.sort((a, b) => {
        const stateOrder = { live: 0, upcoming: 1, finished: 2 };
        const sa = stateOrder[getMatchLiveState(a, nowMs)], sb = stateOrder[getMatchLiveState(b, nowMs)];
        return sa !== sb ? sa - sb : a.startUtc - b.startUtc;
      });
      window._currentlyRendered = list;
      if (list.length === 0) { listEl.innerHTML = `<div class="empty-msg">No matches found in this section.</div>`; return; }

      listEl.innerHTML = list.map((ev, idx) => {
        const state = getMatchLiveState(ev, nowMs), isLive = state === 'live', headerText = `${ev.category.toUpperCase()} | ${ev.eventName.toUpperCase()}`;
        const logoA = ev.teamAFlag || createFallbackBadge(ev.teamAName), logoB = ev.teamBFlag || createFallbackBadge(ev.teamBName), logoLeague = ev.eventLogo || createFallbackBadge(ev.eventName);
        const safeA = ev.teamAName.replace(/'/g, "\\'"), safeB = ev.teamBName.replace(/'/g, "\\'"), safeL = ev.eventName.replace(/'/g, "\\'");
        const centerHTML = isLive ? `<div class="live-indicator"><span class="live-dot"></span><span class="live-text">Live</span></div>` : `<div class="match-time">${ev.bdTime12}</div><div class="match-date">${ev.bdDate}</div>`;
        const bottomTabText = getCardBottomStatusText(ev, nowMs);
        return `<article class="match-card" data-card-idx="${idx}" data-state="${state}" onclick="goToPlayer(${idx}, 0)"><div class="card-header"><img class="league-icon" src="${logoLeague}" data-raw="${logoLeague}" loading="eager" decoding="async" alt="" onerror="onLogoError(this, '${safeL}')" /><div class="league-title">${headerText}</div></div><div class="card-body"><div class="team-side"><div class="team-logo-wrap"><img src="${logoA}" data-raw="${logoA}" loading="eager" decoding="async" alt="${ev.teamAName}" onerror="onLogoError(this, '${safeA}')" /></div><div class="team-name">${ev.teamAName}</div></div><div class="center-info">${centerHTML}</div><div class="team-side right"><div class="team-name">${ev.teamBName}</div><div class="team-logo-wrap"><img src="${logoB}" data-raw="${logoB}" loading="eager" decoding="async" alt="${ev.teamBName}" onerror="onLogoError(this, '${safeB}')" /></div></div></div><div class="card-footer">${ev.isHot ? `<div class="hot-ribbon">HOT 🔥</div>` : ''}<div class="bottom-status-tab" data-timer-el="${idx}">${bottomTabText}</div></div></article>`;
      }).join('');
    }

    setInterval(() => {
      const rendered = window._currentlyRendered || [];
      if (!rendered.length) return;
      const nowMs = Date.now();
      let stateChanged = false;
      rendered.forEach((ev, idx) => {
        const cardEl = document.querySelector(`[data-card-idx="${idx}"]`), timerEl = document.querySelector(`[data-timer-el="${idx}"]`), currentState = getMatchLiveState(ev, nowMs);
        if (cardEl && cardEl.getAttribute('data-state') !== currentState) stateChanged = true;
        if (timerEl) timerEl.textContent = getCardBottomStatusText(ev, nowMs);
      });
      if (stateChanged) { renderStatusPills(); renderMatches(); }
    }, 1000);

    window.selectSport = function(sportKey) { selectedSport = sportKey; renderSportBoxes(); renderStatusPills(); renderMatches(); };
    window.selectStatus = function(statusId) { selectedStatus = statusId; renderStatusPills(); renderMatches(); };

    // Matches Modal has been bypassed. Directly loading the player page.
    window.goToPlayer = function(matchIdx, channelIdx) {
      const ev = (window._currentlyRendered || [])[matchIdx];
      if (!ev) return;
      localStorage.setItem('dreamlive_selected_match', JSON.stringify({ ...ev, channelIndex: channelIdx }));
      window.location.href = `player.html?teamA=${encodeURIComponent(ev.teamAName)}&ch=${channelIdx}`;
    };

    document.getElementById('searchBtn').addEventListener('click', () => { const drawer = document.getElementById('searchDrawer'); drawer.classList.toggle('open'); if (drawer.classList.contains('open')) document.getElementById('searchInput').focus(); });
    document.getElementById('searchInput').addEventListener('input', (e) => { searchQuery = e.target.value.trim(); renderStatusPills(); renderMatches(); });
    document.getElementById('searchClear').addEventListener('click', () => { searchQuery = ''; document.getElementById('searchInput').value = ''; document.getElementById('searchDrawer').classList.remove('open'); renderStatusPills(); renderMatches(); });

    async function loadEventsFromApi() {
      const refreshBtn = document.getElementById('refreshBtn');
      refreshBtn.classList.add('spinning');
      try {
        const res = await fetch(API_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        const rawList = Array.isArray(json) ? json : (json.events || json.data || []);
        const extracted = rawList.map(item => item.event || item).filter(ev => ev && ev.teamAName && ev.visible !== false);
        if (extracted.length > 0) allEvents = extracted.map(computeEventTiming);
      } catch (err) {
        console.error(err);
      } finally {
        setTimeout(() => refreshBtn.classList.remove('spinning'), 300);
        renderSportBoxes(); renderStatusPills(); renderMatches();
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', loadEventsFromApi);
    loadEventsFromApi();
    setInterval(loadEventsFromApi, 120000);
  </script>
</body>
</html>
