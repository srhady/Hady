<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LiveSportsPlay | Streaming Football, Cricket, and Basketball</title>
    
    <style>
        /* ------------------ 90Sport Geometric Texture Style ------------------ */
        .unique-match-card-texture {
            /* This creates a subtle dark geometric shape pattern, similar to 90Sport */
            background-color: #0d111c; /* Solid background base color from 90Sport */
            background-image: linear-gradient(135deg, #1e293b 25%, transparent 25%),
                              linear-gradient(225deg, #1e293b 25%, transparent 25%),
                              linear-gradient(45deg, #1e293b 25%, transparent 25%),
                              linear-gradient(315deg, #1e293b 25%, #0d111c 25%);
            background-position: 10px 0, 10px 0, 0 0, 0 0;
            background-size: 20px 20px;
            background-repeat: repeat;
            
            border: 1px solid rgba(255,255,255,0.05); /* Very subtle transparent border */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); /* Deep shadow */
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        /* Hover effect, similar to other cards */
        .unique-match-card-texture:hover {
            transform: translateY(-3px);
            border-color: #00f2fe; /* Active border color from other elements */
        }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#00081c] text-white font-[Sora,sans-serif]">

    <header class="bg-[#040d21] p-4 border-b border-slate-800/50 flex-shrink-0 z-50 relative">
        <div class="max-w-3xl mx-auto flex justify-between items-center w-full">
            <h1 class="font-bold text-xl md:text-2xl tracking-tight flex items-center gap-1 logo-text">
                <span class="text-white">LiveSports</span><span class="text-red-500">Play</span>
            </a>
            <a href="https://t.me/livesportsplay" target="_blank" class="bg-blue-600 text-white px-5 py-2 rounded-full text-xs font-bold flex items-center gap-2 transition hover:bg-blue-700">
                <i class="fab fa-telegram-plane"></i><span>Join Telegram</span>
            </a>
        </div>
    </header>

    <main class="flex-grow max-w-3xl mx-auto p-4 w-full">
        
        <h2 class="font-bold text-lg md:text-xl text-slate-100 mb-5 mt-3 px-1" id="page-title">Featured Matches</h2>
        
        <div class="mb-6 px-1">
            <div class="relative">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Search by match, team, league..." class="w-full px-5 py-3 pl-11 bg-white/5 border border-white/10 rounded-full text-white text-sm outline-none focus:border-[#00f2fe] transition placeholder-slate-500">
            </div>
        </div>

        <div id="filter-tabs" class="flex gap-2 overflow-x-auto pb-3 mb-6 scrollbar-thin scrollbar-thumb-slate-700 scrollbar-track-transparent">
            </div>

        <div id="matches-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5">
            </div>

    </main>
    
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // Fetch multiple JSON sources using Promise.all
            const URL_1 = "https://raw.githubusercontent.com/srhady/data/refs/heads/main/live_sports_playlist.json";
            const URL_2 = "https://raw.githubusercontent.com/srhady/crichd-speical-live-event/refs/heads/main/Live_Events.json";
            const URL_3 = "https://raw.githubusercontent.com/srhady/join_telegram_chennal-livesportsplay/refs/heads/main/custom.json";

            const [res1, res2, res3] = await Promise.all([
                fetch(URL_1 + "?t=" + Date.now()).catch(() => null),
                fetch(URL_2 + "?t=" + Date.now()).catch(() => null),
                fetch(URL_3 + "?t=" + Date.now()).catch(() => null)
            ]);

            let data1 = res1 && res1.ok ? await res1.json() : [];
            let data2 = res2 && res2.ok ? await res2.json() : [];
            let data3 = res3 && res3.ok ? await res3.json() : [];

            // Normalizing Data Arrays
            data1 = Array.isArray(data1) ? data1 : (data1.channels ? data1.channels : []);
            data2 = Array.isArray(data2) ? data2 : (data2.matches ? data2.matches : [data2]);
            data3 = Array.isArray(data3) ? data3 : (data3.matches ? data3.matches : [data3]);

            // Map 1
            let mapped1 = data1.map(item => ({
                "Match Title": item["Match Title"] || item["Watch Title"] || "Unknown",
                "League": item["League"] || item["Category"] || "Other",
                "Start Time": item["Start Time"] || "",
                "Team 1 Logo": item["Team 1 Logo"], "Team 2 Logo": item["Team 2 Logo"],
                "Streams": item["Streams"] || []
            }));

            // Map 2 (CricHD format)
            let mapped2 = data2.map(item => ({
                "Match Title": item["match name"] || "Live Cricket Match",
                "League": item["category"] || "Cricket",
                "Start Time": item["Start time"] || "",
                // We don't need Streams for the front page card, just for data merging
                "Streams": (item["Channels"] || []).map(ch => ({
                    "Embed_URL": ch["Embed link"], "Quality": ch["Language"]
                }))
            }));

            // Map 3 (Custom format)
            let mapped3 = data3.map(item => ({
                "Match Title": item["Match Title"] || item["match name"] || "Live Match",
                "League": item["Category"] || item["category"] || "Other",
                "Start Time": item["Start Time"] || item["Start time"] || "",
                "Streams": (item["Streams"] || item["Channels"] || []).map(ch => ({
                    "Embed_URL": ch["Embed_URL"] || ch["Embed link"], "Quality": ch["Quality"] || ch["Language"] || "HD"
                }))
            }));

            const allMatches = [...mapped1, ...mapped2, ...mapped3];
            const matchesGrid = document.getElementById('matches-grid');

            if (allMatches.length > 0) {
                matchesGrid.innerHTML = ""; // Clear loader
                
                // Add unique category filter buttons
                const categories = ['All', ...new Set(allMatches.map(m => m["League"] || m["Category"]))];
                const filterTabs = document.getElementById('filter-tabs');
                categories.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap transition ' + (cat === 'All' ? 'bg-[#ef4444] text-white active-filter' : 'bg-white/5 text-slate-300 hover:bg-white/10');
                    btn.innerText = cat;
                    btn.onclick = () => filterMatches(cat);
                    filterTabs.appendChild(btn);
                });

                // Display initial matches
                allMatches.forEach(match => createMatchCard(match));

                // Initialize Search
                document.getElementById('searchInput').addEventListener('input', (e) => searchMatches(e.target.value));

            } else {
                matchesGrid.innerHTML = "<p class='text-slate-500 text-sm'>No matches available right now.</p>";
            }

            // Function to create a match card with the UNIQUE background texture
            function createMatchCard(match) {
                const card = document.createElement('div');
                
                // --- 🛑 ONLY CHANGE: Unique Geometric Texture Background Class 🛑 ---
                // We add the CSS class defined at the top of the file here
                card.className = 'unique-match-card-texture p-6 rounded-2xl flex flex-col justify-between items-center text-center group cursor-pointer';
                card.onclick = () => { window.location.href = `live.html?match=${encodeURIComponent(match["Match Title"])}`; };
                
                // Determine if it's Live or Upcoming
                const statusStr = (match["Match Status"] || "").toLowerCase();
                const isLive = statusStr.includes("live") || match["Start Time"] === "Streaming Now";
                
                // Default logos if links are missing
                const team1Logo = match["Team 1 Logo"] && match["Team 1 Logo"].trim() !== "" ? match["Team 1 Logo"] : "https://placehold.co/100x100/1e293b/ffffff?text=Team+1";
                const team2Logo = match["Team 2 Logo"] && match["Team 2 Logo"].trim() !== "" ? match["Team 2 Logo"] : "https://placehold.co/100x100/1e293b/ffffff?text=Team+2";

                card.innerHTML = `
                    <div class="w-full flex justify-between items-center mb-5 text-slate-400">
                        <span class="font-semibold text-xs py-1 px-3 bg-white/5 rounded-full">${match["League"] || match["Category"] || "Other"}</span>
                        ${isLive ? `<span class="font-semibold text-xs py-1 px-3 bg-red-600/10 text-red-500 rounded-full flex items-center gap-1.5"><div class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></div> Live</span>` : `<span class="font-semibold text-xs py-1 px-3 bg-yellow-500/10 text-yellow-500 rounded-full">Upcoming</span>`}
                    </div>
                    
                    <div class="w-full flex justify-around items-center mb-5">
                        <img src="${team1Logo}" alt="Team 1" class="w-16 h-16 rounded-full object-cover bg-white" onerror="this.src='https://placehold.co/100x100/1e293b/ffffff?text=Logo'">
                        <div class="bg-slate-800/80 px-4 py-1 rounded-full font-extrabold text-slate-200 border border-slate-700/50">VS</div>
                        <img src="${team2Logo}" alt="Team 2" class="w-16 h-16 rounded-full object-cover bg-white" onerror="this.src='https://placehold.co/100x100/1e293b/ffffff?text=Logo'">
                    </div>
                    
                    <div class="w-full text-slate-200">
                        <h4 class="font-extrabold text-sm mb-1 group-hover:text-red-500 transition">${match["Match Title"].split('|')[0].trim()}</h4>
                        <p class="text-xs text-slate-500 font-semibold">${match["Start Time"] || "Streaming Now"}</p>
                    </div>
                    
                    <div class="absolute bottom-[-10px] left-0 right-0 h-3 bg-[#0d111c] rounded-b-2xl blur-md opacity-70"></div>
                `;
                matchesGrid.appendChild(card);
            }

            // Function to filter matches by category
            function filterMatches(category) {
                // Update active tab styling
                const filterTabs = document.getElementById('filter-tabs');
                filterTabs.querySelectorAll('button').forEach(btn => {
                    if (btn.innerText === category) {
                        btn.className = 'px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap transition bg-[#ef4444] text-white active-filter';
                    } else {
                        btn.className = 'px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap transition bg-white/5 text-slate-300 hover:bg-white/10';
                    }
                });

                // Clear and repopulate grid
                matchesGrid.innerHTML = "";
                const filtered = category === 'All' ? allMatches : allMatches.filter(m => (m["League"] || m["Category"]) === category);
                filtered.forEach(match => createMatchCard(match));
                document.getElementById('page-title').innerText = category === 'All' ? 'Featured Matches' : `${category} Matches`;
                // Clear search input
                document.getElementById('searchInput').value = '';
            }

            // Function to search matches
            function searchMatches(query) {
                if (!query || query.trim() === '') {
                    // Repopulate with all matches if search query is empty
                    matchesGrid.innerHTML = "";
                    allMatches.forEach(match => createMatchCard(match));
                    // Reset active tab to 'All'
                    filterMatches('All');
                    return;
                }
                const lowQuery = query.toLowerCase();
                const filtered = allMatches.filter(match => {
                    const titleLow = match["Match Title"].toLowerCase();
                    const leagueLow = (match["League"] || match["Category"] || "").toLowerCase();
                    return titleLow.includes(lowQuery) || leagueLow.includes(lowQuery);
                });

                matchesGrid.innerHTML = "";
                if (filtered.length > 0) {
                    filtered.forEach(match => createMatchCard(match));
                } else {
                    matchesGrid.innerHTML = `<p class='text-slate-500 text-sm'>No matches found for "${query}".</p>`;
                }
                document.getElementById('page-title').innerText = `Search results for "${query}"`;
                // Remove active filter styling from tabs
                const filterTabs = document.getElementById('filter-tabs');
                filterTabs.querySelectorAll('button').forEach(btn => {
                    btn.className = 'px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap transition bg-white/5 text-slate-300 hover:bg-white/10';
                });
            }
        });
    </script>
</body>
</html>
