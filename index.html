.player-wrapper{width:100%;position:sticky;top:0;z-index:9999;background:#000;display:none;border-bottom:2px solid #00a0e3;box-shadow:0 4px 15px rgba(0,0,0,.8);}

.ticker-text{display:inline-block;padding-left:100%;animation:ticker 15s linear infinite;font-family:'CustomBangla',sans-serif;font-size:13px;font-weight:bold;color:#fff;}

.main-container.is-playing .player-wrapper{display:block;width:70%;position:sticky;top:20px;border-radius:12px;overflow:hidden;border:1px solid #2a2a35;border-bottom:none;box-shadow:0 10px 30px rgba(0,0,0,.6);}
.main-container.is-playing .list-wrapper{width:30%;background:#0a0a0f;border-radius:12px;border:1px solid #1a1a24;height:calc(100vh - 100px);position:sticky;top:20px;overflow:hidden;}

.main-container.is-playing .channel-grid::-webkit-scrollbar-thumb{background:#00a0e3;border-radius:10px;}
.main-container.is-playing .categories{border-bottom:1px solid #1a1a24;padding-bottom:12px;}
}
