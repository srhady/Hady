<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream | LiveSportsPlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap');
        
        body {
            background-color: #00081c; 
            color: white;
            font-family: 'Sora', sans-serif;
            overflow-x: hidden;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; 
            height: 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }

        /* 90Sport style gradient box */
        .vip-team-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        /* Countdown display styling */
        .countdown-box {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #334155;
            backdrop-filter: blur(5px);
        }

        /* Hide scrollbar for server buttons */
        #server-buttons::-webkit-scrollbar { display: none; }
        #server-buttons { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="bg-[#040d21] p-4 border-b border-slate-800/50">
        <div class="max-w-3xl mx-auto flex justify-between items-center w-full">
            <a href="index.html" class="flex items-center gap-2 text-slate-300 hover:text-red-500 transition font-medium text-sm md:text-base">
                <i class="fas fa-arrow-left"></i>
                <span>Home</span>
            </a>
            <a href="index.html" class="font-bold text-lg md:text-xl tracking-tight flex items-center gap-1 logo-text">
                <span class="text-white">LiveSports</span><span class="text-red-500">Play</span>
            </a>
        </div>
    </header>

    <main class="flex-grow max-w-3xl mx-auto p-4 w-full">
        
        <h2 class="font-bold text-lg md:text-xl text-slate-100 mb-4 mt-2" id="match-title">Loading...</h2>
        
        <div id="upcoming-box" class="mb-5 relative rounded-lg overflow-hidden border border-slate-700 hidden">
            <img src="https://images.unsplash.com/photo-1521731978332-9e9e714bdd20?q=80&w=800&auto=format&fit=crop" alt="Stadium" class="w-full h-auto object-cover opacity-40">
            
            <div class="absolute inset-0 flex flex-col justify-center items-center p-4 text-center">
                <p class="text-xs md:text-sm text-slate-300 mb-3 font-semibold tracking-wider">The match will start in...</p>
                <div id="countdown-display" class="countdown-box flex gap-3 md:gap-5 p-4 md:p-6 rounded-2xl text-white font-bold">
                    <div class="flex flex-col items-center">
                        <span id="cd-days" class="text-2xl md:text-4xl">00</span>
                        <span class="text-[10px] md:text-xs text-slate-400 mt-1">Days</span>
                    </div>
                    <span class="text-2xl md:text-4xl text-slate-500">:</span>
                    <div class="flex flex-col items-center">
                        <span id="cd-hours" class="text-2xl md:text-4xl">00</span>
                        <span class="text-[10px] md:text-xs text-slate-400 mt-1">Hours</span>
                    </div>
                    <span class="text-2xl md:text-4xl text-slate-500">:</span>
                    <div class="flex flex-col items-center">
                        <span id="cd-minutes" class="text-2xl md:text-4xl">00</span>
                        <span class="text-[10px] md:text-xs text-slate-400 mt-1">Minutes</span>
                    </div>
                    <span class="text-2xl md:text-4xl text-slate-500">:</span>
                    <div class="flex flex-col items-center">
                        <span id="cd-seconds" class="text-2xl md:text-4xl">00</span>
                        <span class="text-[10px] md:text-xs text-slate-400 mt-1">Seconds</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="video-container-box" class="video-container mb-5 border border-slate-700 hidden">
            <iframe id="video-frame" src="" frameborder="0" allowfullscreen></iframe>
        </div>

        <div class="flex justify-between items-center mb-5 p-3 rounded-lg border border-slate-700 bg-slate-800/50">
            <span class="font-semibold text-slate-300 text-sm md:text-base px-2 py-1 bg-slate-800 rounded-md" id="league-name">League</span>
            
            <div class="flex gap-2.5">
                <button id="native-share-btn" class="bg-[#ef4444] text-white px-5 py-2 rounded-full text-sm font-bold flex items-center gap-2 shadow-[0_0_10px_rgba(239,68,68,0.3)] hover:shadow-[0_0_15px_rgba(239,68,68,0.5)] transition">
                    <i class="fas fa-share-alt"></i> Share
                </button>
                <button id="copy-link-btn" class="bg-slate-700 text-white px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2 hover:bg-slate-600 transition" title="Copy match link">
                    <i class="fas fa-link"></i>
                </button>
            </div>
        </div>

        <p class="text-slate-400 font-semibold text-sm mb-6 px-1" id="match-kickoff">Kick off: --:--</p>

        <h3 class="text-slate-300 font-semibold mb-3 text-sm px-1">Available Streams:</h3>

        <div id="server-buttons" class="flex gap-2 overflow-x-auto pb-3 mb-8">
            </div>

        <div id="vip-teams-card-container" class="vip-team-card justify-around items-center p-6 md:p-8 rounded-2xl mb-6 hidden">
            <img id="team1-logo" src="" alt="Team 1" class="w-20 h-20 md:w-24 md:h-24 rounded-full object-cover bg-white p-1" onerror="this.style.display='none'">
            
            <div class="bg-slate-800 px-5 py-2 rounded-full font-extrabold text-slate-300 border border-slate-700 text-lg">VS</div>
            
            <img id="team2-logo" src="" alt="Team 2" class="w-20 h-20 md:w-24 md:h-24 rounded-full object-cover bg-white p-1" onerror="this.style.display='none'">
        </div>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const matchTitle = urlParams.get('match'); 
            const jsonUrl = 'https://raw.githubusercontent.com/srhady/data/refs/heads/main/live_sports_playlist.json';
            
            // --- ১. স্মার্ট শেয়ার এবং কপি লিংক ফিচার ---
            const currentUrl = window.location.href;
            const encodedUrl = encodeURIComponent(currentUrl);

            // নেটিভ শেয়ার বাটন (ফোনের অরিজিনাল পপ-আপ)
            const shareBtn = document.getElementById('native-share-btn');
            shareBtn.addEventListener('click', async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: `Watch Live: ${matchTitle} | LiveSportsPlay`,
                            text: `Catch all the action live for FREE on LiveSportsPlay! 🏆⚽🏀`,
                            url: currentUrl,
                        });
                        console.log('Successfully shared');
                    } catch (error) {
                        console.error('Error sharing:', error);
                    }
                } else {
                    // যদি ব্রাউজার নেটিভ শেয়ার সাপোর্ট না করে, তবে ফেইসবুকে শেয়ার করবে
                    window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`, '_blank');
                }
            });

            // লিংক কপি বাটন
            const copyBtn = document.getElementById('copy-link-btn');
            copyBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(currentUrl).then(() => {
                    // কপি করার পর আইকন বা টেক্সট চেঞ্জ করে ইউজারকে ফিডব্যাক দেওয়া
                    copyBtn.innerHTML = '<i class="fas fa-check text-green-400"></i>';
                    setTimeout(() => {
                        copyBtn.innerHTML = '<i class="fas fa-link"></i>';
                    }, 2000); // ২ সেকেন্ড পর আগের আইকন ফিরে আসবে
                }).catch(err => {
                    console.error('Could not copy text: ', err);
                });
            });

            if (!matchTitle) {
                document.getElementById('match-title').innerText = "Match not found!";
                return;
            }

            try {
                // আপনার আসল JSON ফাইলের লিংক থেকে ডেটা ফেচ করা
                const response = await fetch(jsonUrl); 
                const data = await response.json();

                // ১ম পেজে যে ম্যাচে ক্লিক করা হয়েছে, সেটি খুঁজে বের করা
                const matchData = data.find(m => m["Match Title"] === matchTitle);

                if (matchData) {
                    document.getElementById('match-title').innerText = matchData["Match Title"];
                    document.getElementById('league-name').innerText = matchData["League"] || "Live Sports";
                    document.getElementById('match-kickoff').innerText = "Kick off: " + (matchData["Start Time"] || "N/A");
                    
                    // --- ২. ভিআইপি টিম কার্ড লজিক (শুধু লোগো, নাম গায়েব) ---
                    const teamCardContainer = document.getElementById('vip-teams-card-container');
                    if (matchData["Team 1 Logo"] && matchData["Team 1 Logo"].trim() !== "") {
                        document.getElementById('team1-logo').src = matchData["Team 1 Logo"];
                        document.getElementById('team2-logo').src = matchData["Team 2 Logo"];
                        // লোগো থাকলে বক্স দেখাবে
                        teamCardContainer.classList.remove("hidden");
                        teamCardContainer.classList.add("flex");
                    } else {
                        // লোগো না থাকলে পুরো বক্স লুকিয়ে ফেলবে
                        teamCardContainer.classList.add("hidden");
                        teamCardContainer.classList.remove("flex");
                    }

                    // --- ৩. আপকামিং কাউন্টডাউন এবং ১০ মিনিট আগের লাইভ লজিক ---
                    const startTimeRaw = matchData["Start Time"] || "";
                    let countdownInterval;

                    // BST থেকে Local Time এ কনভার্ট করার লজিক (আপনার প্রথম পেজের কোড থেকে নেওয়া)
                    function getMatchDateObj(bstString) {
                        if (!bstString || !bstString.includes("|")) return null;
                        try {
                            const [timePart, datePart] = bstString.split("|").map(s => s.trim());
                            const [day, monthStr] = datePart.split("-");
                            const monthMap = { "Jan": "01", "Feb": "02", "Mar": "03", "Apr": "04", "May": "05", "Jun": "06", "Jul": "07", "Aug": "08", "Sep": "09", "Oct": "10", "Nov": "11", "Dec": "12" };
                            const month = monthMap[monthStr] || "01";
                            const year = new Date().getFullYear(); 

                            let [time, modifier] = timePart.split(" ");
                            let [hours, minutes] = time.split(":");
                            hours = parseInt(hours, 10);
                            
                            if (hours === 12) hours = 0;
                            if (modifier && modifier.toUpperCase() === "PM") hours += 12;

                            // BST (GMT+6) থেকে ISO স্ট্রিং তৈরি করা
                            const isoString = `${year}-${month}-${day.padStart(2, '0')}T${hours.toString().padStart(2, '0')}:${minutes.padStart(2, '0')}:00+06:00`;
                            return new Date(isoString);
                        } catch (e) {
                            return null;
                        }
                    }

                    const matchDate = getMatchDateObj(startTimeRaw);
                    const now = new Date();

                    // যদি আপকামিং হয় (ম্যাচের ১০ মিনিট আগের বেশি সময় বাকি থাকে)
                    if (matchDate && now.getTime() < matchDate.getTime() - 600000) {
                        const upcomingBox = document.getElementById('upcoming-box');
                        upcomingBox.classList.remove("hidden"); // স্টেডিয়াম বক্স দেখাবে

                        // কাউন্টডাউন আপডেট করার ফাংশন
                        function updateCountdown() {
                            const currentTime = new Date();
                            const difference = matchDate.getTime() - currentTime.getTime();

                            // যদি ১০ মিনিট বাকি থাকে, কাউন্টডাউন বন্ধ করে লাইভ প্লেয়ার দেখাবে
                            if (difference <= 600000) { 
                                clearInterval(countdownInterval);
                                showLivePlayer(matchData);
                                return;
                            }

                            // দিন, ঘণ্টা, মিনিট, সেকেন্ড ক্যালকুলেশন
                            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                            // HTML এ কাউন্টডাউন বসানো
                            document.getElementById('cd-days').innerText = days.toString().padStart(2, '0');
                            document.getElementById('cd-hours').innerText = hours.toString().padStart(2, '0');
                            document.getElementById('cd-minutes').innerText = minutes.toString().padStart(2, '0');
                            document.getElementById('cd-seconds').innerText = seconds.toString().padStart(2, '0');
                        }

                        updateCountdown(); // শুরুতে একবার রান করা
                        countdownInterval = setInterval(updateCountdown, 1000); // প্রতি সেকেন্ডে আপডেট

                    } else {
                        // যদি অলরেডি ১০ মিনিটের ভেতর থাকে, সরাসরি লাইভ প্লেয়ার দেখাবে
                        showLivePlayer(matchData);
                    }

                } else {
                    document.getElementById('match-title').innerText = "ম্যাচটি পাওয়া যায়নি বা শেষ হয়ে গেছে।";
                }
            } catch (error) {
                console.error("ডেটা লোড করতে সমস্যা হচ্ছে:", error);
            }
        });

        // লাইভ প্লেয়ার এবং সার্ভার বাটন দেখানোর ফাংশন
        function showLivePlayer(matchData) {
            // আপকামিং বক্স হাইড করা
            document.getElementById('upcoming-box').classList.add("hidden");
            
            const videoContainerBox = document.getElementById('video-container-box');
            const videoFrame = document.getElementById('video-frame');
            const serverContainer = document.getElementById('server-buttons');
            
            // ভিডিও প্লেয়ার কন্টেইনার দেখানো
            videoContainerBox.classList.remove("hidden");
            
            serverContainer.innerHTML = ""; // আগের বাটন ক্লিয়ার করা
            
            // "Streams" অ্যারে থেকে বাটন তৈরি করা
            if (matchData.Streams && matchData.Streams.length > 0) {
                matchData.Streams.forEach((stream, index) => {
                    const btn = document.createElement('button');
                    // পাশাপাশি বাটনের জন্য Tailwind ক্লাস (ডার্ক ও রাউন্ডেড)
                    btn.className = 'bg-slate-800 text-slate-100 px-5 py-2.5 rounded-full text-sm font-semibold whitespace-nowrap border border-slate-700 hover:bg-[#ef4444] hover:text-white transition flex-shrink-0';
                    btn.innerText = `▶ Server ${stream.Stream_No || index + 1} (${stream.Quality || 'HD'})`;
                    
                    btn.onclick = () => { videoFrame.src = stream.Embed_URL; };
                    serverContainer.appendChild(btn);
                });
                
                // শুরুতে প্রথম সার্ভারের ভিডিও লোড করা
                videoFrame.src = matchData.Streams[0].Embed_URL;
            } else {
                serverContainer.innerHTML = "<p style='color:#ef4444; padding:0 10px;'>এই মুহূর্তে কোনো লাইভ স্ট্রিম লিংক পাওয়া যায়নি!</p>";
            }
        }
    </script>
</body>
</html>
