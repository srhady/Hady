<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream | LiveSportsPlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap');
        
        body {
            background-color: #00081c; /* ডার্ক থিম */
            color: white;
            font-family: 'Sora', sans-serif;
            overflow-x: hidden;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }

        /* সোশ্যাল শেয়ার আইকন স্টাইল */
        .share-icons a {
            display: inline-flex; justify-content: center; align-items: center;
            width: 38px; height: 38px; border-radius: 50%;
            color: white; text-decoration: none; font-size: 16px;
            transition: transform 0.2s;
        }
        .share-icons a:hover { transform: scale(1.1); }
        .fb { background: #1877F2; } 
        .wa { background: #25D366; } 
        .tg { background: #0088cc; }

        /* কমলা সার্ভার বাটন */
        .server-btn {
            background-color: #f25c27; /* ছবির অরেঞ্জ কালার */
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            margin-bottom: 12px;
            transition: background-color 0.2s;
        }
        .server-btn:hover { background-color: #d1491a; }

        /* টিম কার্ডের স্টাইল */
        .teams-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="p-4 max-w-3xl mx-auto mt-2 w-full border-b border-slate-800/50 flex items-center gap-3">
        <a href="index.html" class="text-white text-xl hover:text-red-500 transition"><i class="fas fa-arrow-left"></i></a>
        <h1 class="font-bold text-lg md:text-xl tracking-tight truncate flex-1" id="match-title">Loading Match...</h1>
    </header>

    <main class="flex-grow max-w-3xl mx-auto p-4 w-full">
        
        <div class="video-container mb-6 border border-slate-700">
            <iframe id="video-frame" src="" frameborder="0" allowfullscreen></iframe>
        </div>

        <div class="flex justify-between items-center mb-6 bg-slate-800/50 p-3 rounded-lg border border-slate-700">
            <span class="font-semibold text-slate-300 text-sm md:text-base px-2 py-1 bg-slate-800 rounded-md" id="league-name">League</span>
            
            <div class="flex items-center gap-3">
                <span class="text-sm text-slate-400 font-semibold hidden md:inline">Share:</span>
                <div class="share-icons flex gap-2">
                    <a href="#" id="share-fb" target="_blank" class="fb"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" id="share-wa" target="_blank" class="wa"><i class="fab fa-whatsapp"></i></a>
                    <a href="#" id="share-tg" target="_blank" class="tg"><i class="fab fa-telegram-plane"></i></a>
                </div>
            </div>
        </div>

        <div class="mb-8">
            <h3 class="text-slate-400 font-semibold mb-3">Available Streams:</h3>
            <div id="server-buttons">
                </div>
        </div>

        <div class="teams-card flex justify-around items-center p-6 rounded-xl mb-6" id="teams-card-container">
            <div class="flex flex-col items-center gap-2">
                <img id="team1-logo" src="" alt="Team 1" class="w-16 h-16 md:w-20 md:h-20 rounded-full object-cover bg-white" onerror="this.style.display='none'">
            </div>
            
            <div class="bg-slate-800 px-5 py-2 rounded-full font-bold text-slate-300 border border-slate-700">VS</div>
            
            <div class="flex flex-col items-center gap-2">
                <img id="team2-logo" src="" alt="Team 2" class="w-16 h-16 md:w-20 md:h-20 rounded-full object-cover bg-white" onerror="this.style.display='none'">
            </div>
        </div>

    </main>

    <script src="app.js?v=3"></script>
</body>
</html>
