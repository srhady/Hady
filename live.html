<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream | LiveSportsPlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap');
        
        body {
            background-color: #00081c; 
            color: white;
            font-family: 'Sora', sans-serif;
            overflow-x: hidden;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; 
            height: 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }

        .vip-team-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="bg-[#040d21] p-4 border-b border-slate-800/50">
        <div class="max-w-3xl mx-auto flex justify-between items-center w-full">
            <a href="index.html" class="flex items-center gap-2 text-slate-300 hover:text-red-500 transition font-medium text-sm md:text-base">
                <i class="fas fa-arrow-left"></i>
                <span>Home</span>
            </a>
            <h1 class="font-bold text-lg md:text-xl tracking-tight flex items-center gap-1">
                <span class="text-white">LiveSports</span><span class="text-red-500">Play</span>
            </h1>
        </div>
    </header>

    <main class="flex-grow max-w-3xl mx-auto p-4 w-full">
        
        <h2 class="font-bold text-lg md:text-xl text-slate-100 mb-4 mt-2" id="match-title">Loading Match...</h2>
        
        <div class="video-container mb-5 border border-slate-700">
            <iframe id="video-frame" src="" frameborder="0" allowfullscreen></iframe>
        </div>

        <div class="flex justify-between items-center mb-5 p-3 rounded-lg border border-slate-700 bg-slate-800/50">
            <span class="font-semibold text-slate-300 text-sm md:text-base px-2 py-1 bg-slate-800 rounded-md" id="league-name">League</span>
            
            <a href="#" id="share-btn" target="_blank" class="bg-[#ef4444] text-white px-5 py-2 rounded-full text-sm font-bold flex items-center gap-2 shadow-[0_0_10px_rgba(239,68,68,0.3)] hover:shadow-[0_0_15px_rgba(239,68,68,0.5)] transition">
                <i class="fas fa-share-alt"></i> Share
            </a>
        </div>

        <p class="text-slate-400 font-semibold text-sm mb-6 px-1" id="match-kickoff">Kick off: --:--</p>

        <h3 class="text-slate-300 font-semibold mb-3 text-sm px-1">Available Streams:</h3>

        <div id="server-buttons" class="flex gap-2 overflow-x-auto pb-3 mb-8 scrollbar-thin scrollbar-thumb-slate-700 scrollbar-track-transparent">
            </div>

        <div id="vip-teams-card-container" class="vip-team-card justify-around items-center p-6 md:p-8 rounded-2xl mb-6 hidden">
            <div class="flex flex-col items-center gap-3 w-1/3">
                <img id="team1-logo" src="" alt="Team 1" class="w-16 h-16 md:w-20 md:h-20 rounded-full object-cover bg-white" onerror="this.style.display='none'">
                <span id="team1-name" class="font-bold text-xs md:text-sm text-center truncate w-full text-slate-200">Team 1</span>
            </div>
            
            <div class="bg-slate-800 px-5 py-2 rounded-full font-extrabold text-slate-300 border border-slate-700">VS</div>
            
            <div class="flex flex-col items-center gap-3 w-1/3">
                <img id="team2-logo" src="" alt="Team 2" class="w-16 h-16 md:w-20 md:h-20 rounded-full object-cover bg-white" onerror="this.style.display='none'">
                <span id="team2-name" class="font-bold text-xs md:text-sm text-center truncate w-full text-slate-200">Team 2</span>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const matchTitle = urlParams.get('match'); 
            
            const currentUrl = window.location.href;
            const encodedUrl = encodeURIComponent(currentUrl);
            document.getElementById('share-btn').href = `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`;

            if (!matchTitle) {
                document.getElementById('match-title').innerText = "কোনো ম্যাচ সিলেক্ট করা হয়নি!";
                return;
            }

            try {
                const jsonUrl = 'https://raw.githubusercontent.com/srhady/data/refs/heads/main/live_sports_playlist.json';
                const response = await fetch(jsonUrl); 
                const data = await response.json();

                const matchData = data.find(m => m["Match Title"] === matchTitle);

                if (matchData) {
                    document.getElementById('match-title').innerText = matchData["Match Title"];
                    document.getElementById('league-name').innerText = matchData["League"] || "Live Sports";
                    document.getElementById('match-kickoff').innerText = "Kick off: " + (matchData["Start Time"] || "24/7 Live");
                    
                    const teamCardContainer = document.getElementById('vip-teams-card-container');
                    
                    if (matchData["Team 1 Name"] && matchData["Team 1 Name"].trim() !== "") {
                        document.getElementById('team1-logo').src = matchData["Team 1 Logo"];
                        document.getElementById('team1-name').innerText = matchData["Team 1 Name"];
                        document.getElementById('team2-logo').src = matchData["Team 2 Logo"];
                        document.getElementById('team2-name').innerText = matchData["Team 2 Name"];
                        teamCardContainer.classList.remove("hidden");
                        teamCardContainer.classList.add("flex");
                    } else {
                        teamCardContainer.classList.add("hidden");
                        teamCardContainer.classList.remove("flex");
                    }

                    const serverContainer = document.getElementById('server-buttons');
                    const videoFrame = document.getElementById('video-frame');
                    serverContainer.innerHTML = ""; 
                    
                    if (matchData.Streams && matchData.Streams.length > 0) {
                        matchData.Streams.forEach((stream, index) => {
                            const btn = document.createElement('button');
                            btn.className = 'bg-slate-800 text-slate-100 px-5 py-2.5 rounded-full text-sm font-semibold whitespace-nowrap border border-slate-700 hover:bg-[#ef4444] hover:text-white transition';
                            btn.innerText = `▶ Server ${stream.Stream_No || index + 1} (${stream.Quality || 'HD'})`;
                            
                            btn.onclick = () => { videoFrame.src = stream.Embed_URL; };
                            serverContainer.appendChild(btn);
                        });
                        videoFrame.src = matchData.Streams[0].Embed_URL;
                    } else {
                        serverContainer.innerHTML = "<p style='color:#ef4444; padding:0 10px;'>এই মুহূর্তে কোনো লাইভ স্ট্রিম লিংক পাওয়া যায়নি!</p>";
                    }

                } else {
                    document.getElementById('match-title').innerText = "ম্যাচটি পাওয়া যায়নি বা শেষ হয়ে গেছে।";
                }
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('match-title').innerText = "ডেটা লোড করতে সমস্যা হচ্ছে!";
            }
        });
    </script>
</body>
</html>
