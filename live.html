<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Stream | LiveSportsPlay</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap');
        
        body {
            background-color: #00081c; 
            color: white;
            font-family: 'Sora', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* ------------------ Video Player Styles ------------------ */
        .player-wrapper {
            position: relative;
            padding-top: 56.25%; /* Default 16:9 */
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: padding-top 0.3s ease;
        }

        /* User's Custom Padding for CricHD */
        .player-wrapper.crichd-mode {
            padding-top:  67%; 
        }

        .stream-frame-default {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; display: none;
        }

        /* CricHD Zoomed Frame */
        .stream-frame-crichd {
            position: absolute; top: -83%; left: -2%; width: 104%; height: 220%; border: 0; display: none;
        }

        .three-click-ad {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 90; cursor: pointer; display: none;
        }

        /* ------------------ UI Components ------------------ */
        .vip-team-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .countdown-box {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #334155;
            backdrop-filter: blur(5px);
        }

        #server-buttons::-webkit-scrollbar { display: none; }
        #server-buttons { -ms-overflow-style: none; scrollbar-width: none; }

        /* ------------------ Chatbox Styles ------------------ */
        .chat-section {
            background: #0a0d14; border: 1px solid #1e293b; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; height: 500px;
        }
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        
        .msg-item { display: flex; gap: 10px; font-size: 13px; line-height: 1.4; word-break: break-word; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .msg-content { display: flex; flex-direction: column; background: rgba(255,255,255,0.05); padding: 10px 14px; border-radius: 0 12px 12px 12px; border: 1px solid rgba(255,255,255,0.02); }
        .msg-author { font-weight: 600; color: #94a3b8; font-size: 11px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .msg-time { font-size: 9px; color: #64748b; font-weight: 400; }
        .msg-text { color: #e2e8f0; font-size: 13px; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="bg-[#040d21] p-4 border-b border-slate-800/50 flex-shrink-0 z-50 relative">
        <div class="max-w-3xl mx-auto flex justify-between items-center w-full">
            <a href="index.html" class="flex items-center gap-2 text-slate-300 hover:text-red-500 transition font-medium text-sm md:text-base">
                <i class="fas fa-arrow-left"></i><span>Home</span>
            </a>
            <a href="index.html" class="font-bold text-lg md:text-xl tracking-tight flex items-center gap-1">
                <span class="text-white">LiveSports</span><span class="text-red-500">Play</span>
            </a>
        </div>
    </header>

    <div id="sticky-video-wrapper" class="sticky top-0 z-40 bg-[#00081c] pt-2 pb-3 px-4 sm:px-0 w-full max-w-3xl mx-auto hidden transition-all">
        <div id="mainPlayerWrapper" class="player-wrapper shadow-xl">
            <iframe id="streamFrameDefault" class="stream-frame-default" src="" frameborder="0" scrolling="no" allowfullscreen allow="encrypted-media" sandbox="allow-scripts allow-same-origin allow-presentation allow-forms"></iframe>
            
            <iframe id="streamFrameCrichd" class="stream-frame-crichd" src="" frameborder="0" scrolling="no" allowfullscreen allow="encrypted-media" sandbox="allow-scripts allow-same-origin allow-presentation allow-forms"></iframe>

    <main class="flex-grow max-w-3xl mx-auto p-4 w-full">
        
        <h2 class="font-bold text-lg md:text-xl text-slate-100 mb-4 mt-2" id="match-title">Loading...</h2>
        
        <div id="upcoming-box" class="mb-5 relative rounded-lg overflow-hidden border border-slate-700 hidden">
            <img src="https://images.unsplash.com/photo-1521731978332-9e9e714bdd20?q=80&w=800&auto=format&fit=crop" alt="Stadium" class="w-full h-auto object-cover opacity-40">
            <div class="absolute inset-0 flex flex-col justify-center items-center p-4 text-center">

                    <div class="flex flex-col items-center"><span id="cd-hours" class="text-2xl md:text-4xl">00</span><span class="text-[10px] md:text-xs text-slate-400 mt-1">Hours</span></div><span class="text-2xl md:text-4xl text-slate-500">:</span>
                    <div class="flex flex-col items-center"><span id="cd-minutes" class="text-2xl md:text-4xl">00</span><span class="text-[10px] md:text-xs text-slate-400 mt-1">Minutes</span></div><span class="text-2xl md:text-4xl text-slate-500">:</span>
                    <div class="flex flex-col items-center"><span id="cd-seconds" class="text-2xl md:text-4xl">00</span><span class="text-[10px] md:text-xs text-slate-400 mt-1">Seconds</span></div>

        <div class="flex justify-between items-center mb-5 p-3 rounded-lg border border-slate-700 bg-slate-800/50">

            <div class="flex gap-2.5">
                <button id="native-share-btn" class="bg-[#ef4444] text-white px-5 py-2 rounded-full text-sm font-bold flex items-center gap-2 shadow-[0_0_10px_rgba(239,68,68,0.3)] hover:bg-red-600 transition">
                    <i class="fas fa-share-alt"></i> Share
                </button>
                <button id="copy-link-btn" class="bg-slate-700 text-white px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2 hover:bg-slate-600 transition" title="Copy match link">
                    <i class="fas fa-link"></i>
                </button>

        </div>

        <p class="text-slate-400 font-semibold text-sm mb-6 px-1" id="match-kickoff">Kick off: --:--</p>

        <h3 class="text-slate-300 font-semibold mb-3 text-sm px-1">Available Streams:</h3>
        <div id="server-buttons" class="flex gap-2 overflow-x-auto pb-3 mb-6"></div>

        <div id="vip-teams-card-container" class="vip-team-card justify-around items-center p-6 md:p-8 rounded-2xl mb-8 hidden">
            <img id="team1-logo" src="" alt="Team 1" class="w-20 h-20 md:w-24 md:h-24 rounded-full object-contain bg-white p-1" onerror="this.src='https://placehold.co/100x100/1e293b/ffffff?text=Logo'">
            <div class="bg-slate-800 px-5 py-2 rounded-full font-extrabold text-slate-300 border border-slate-700 text-lg">VS</div>
            <img id="team2-logo" src="" alt="Team 2" class="w-20 h-20 md:w-24 md:h-24 rounded-full object-contain bg-white p-1" onerror="this.src='https://placehold.co/100x100/1e293b/ffffff?text=Logo'">
        </div>

        <div class="chat-section mb-10 shadow-lg" id="chatbox-container">
            <div class="bg-slate-800/80 p-3 px-4 font-semibold text-sm border-b border-slate-700 flex justify-between items-center text-slate-200">
                <div class="flex items-center gap-2"><i class="fas fa-comments text-[#00f2fe]"></i> VIP Chatroom</div>
                <div class="text-xs text-slate-400 flex items-center gap-1.5"><i class="fas fa-eye text-[#ff2a5f] animate-pulse"></i> <span id="randomViewers">12.4k</span></div>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="text-center text-slate-500 text-xs mt-4 bg-white/5 p-2 rounded-lg mx-4">End-to-end encrypted VIP Chat</div>
            </div>
            
            <div class="p-3 bg-black border-t border-slate-800 flex flex-col gap-2.5">
                <div class="flex items-center bg-white/5 rounded-lg px-3 py-1 w-max border border-slate-700/50">
                    <i class="fas fa-user text-slate-500 text-xs mr-2"></i>
                    <input type="text" id="chatName" placeholder="Your Name (Optional)" class="bg-transparent border-none text-xs text-white outline-none w-28 placeholder-slate-500">
                </div>
                <div class="flex gap-2">
                    <input type="text" id="chatText" placeholder="Say something..." onkeypress="handleEnter(event)" class="flex-1 px-4 py-2.5 bg-white/5 border border-white/10 rounded-full text-white text-sm outline-none focus:border-[#00f2fe] transition">
                    <button onclick="postMessage()" class="bg-[#00f2fe] w-10 h-10 rounded-full text-black flex justify-center items-center hover:scale-95 transition shadow-[0_0_10px_rgba(0,242,254,0.3)] shrink-0">
                        <i class="fas fa-paper-plane text-sm -ml-0.5"></i>
                    </button>
                </div>
            </div>

    </main>

    <script src="https://pl28969449.profitablecpmratenetwork.com/f5/7f/f0/f57ff0d0d82e997ed6292a80ac564d78.js"></script>
    <script src="https://pl28969445.profitablecpmratenetwork.com/82/df/04/82df04c11be90ebee69e49d27bd6ad62.js"></script>

    <script>
        // ------------------ Firebase Config ------------------
        firebase.initializeApp({
            apiKey: "AIzaSyDkV_pw1zfkzBAprnq2UGamFbA1defWPnY",
            authDomain: "livesportsplay-bc7f8.firebaseapp.com",
            databaseURL: "https://livesportsplay-bc7f8-default-rtdb.firebaseio.com",
            projectId: "livesportsplay-bc7f8",
            storageBucket: "livesportsplay-bc7f8.firebasestorage.app",
            messagingSenderId: "669238923994",
            appId: "1:669238923994:web:4f24e92be31f09677c0be3"
        });
        const db = firebase.database();
        
        let matchId = '';
        document.getElementById('randomViewers').innerText = (Math.random()*(50-10)+10).toFixed(1)+'k';
        
        // ------------------ 3-Click Ad Logic ------------------
        let adClicks = 0;
        const maxClicks = 3;
        const adLink = "https://www.profitablecpmratenetwork.com/xpn6ymwsw2?key=fa95422004994fcfb18590e810849da7";
        const threeClickAdLayer = document.getElementById('threeClickAd');
        
        threeClickAdLayer.addEventListener('click', function(e) {
            adClicks++;
            window.open(adLink, '_blank'); 
            if(adClicks >= maxClicks) {
                this.style.display = 'none'; 
            }
        });

        // ------------------ Dual Player Function ------------------
        function playStreamOnRightFrame(url) {
            const playerWrapper = document.getElementById('mainPlayerWrapper');
            const defaultFrame = document.getElementById('streamFrameDefault');
            const crichdFrame = document.getElementById('streamFrameCrichd');

            defaultFrame.style.display = 'none';
            crichdFrame.style.display = 'none';
            defaultFrame.src = '';
            crichdFrame.src = '';

            // Check if it's CricHD or Dadocric
            if (url && (url.includes('dadocric') || url.includes('crichd'))) {
                playerWrapper.classList.add('crichd-mode');
                crichdFrame.style.display = 'block';
                crichdFrame.src = url;
            } else {
                playerWrapper.classList.remove('crichd-mode');
                defaultFrame.style.display = 'block';
                defaultFrame.src = url;
            }

            // Show 3-Click Ad for ALL servers if clicks < maxClicks
            if(adClicks < maxClicks) {
                threeClickAdLayer.style.display = 'block';
            } else {
                threeClickAdLayer.style.display = 'none';
            }
        }

        // ------------------ Main App Logic ------------------
        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const rawMatchTitle = urlParams.get('match'); 
            
            // Share features
            const currentUrl = window.location.href;
            document.getElementById('native-share-btn').addEventListener('click', async (e) => {
                e.preventDefault();
                if (navigator.share) {
                    try { await navigator.share({ title: `Watch Live: ${rawMatchTitle || 'Sports'}`, url: currentUrl }); } 
                    catch (error) {}
                } else {
                    alert("আপনার ব্রাউজার ডিরেক্ট শেয়ার সাপোর্ট করছে না! লিংক কপি করুন।");
                }
            });
            document.getElementById('copy-link-btn').addEventListener('click', () => {
                navigator.clipboard.writeText(currentUrl).then(() => {
                    document.getElementById('copy-link-btn').innerHTML = '<i class="fas fa-check text-green-400"></i>';
                    setTimeout(() => { document.getElementById('copy-link-btn').innerHTML = '<i class="fas fa-link"></i>'; }, 2000);
                });
            });

            if (!rawMatchTitle) { document.getElementById('match-title').innerText = "Match not found!"; return; }

            // Title formatting for Chat ID
            matchId = rawMatchTitle.split('|')[0].trim().replace(/[^a-zA-Z0-9]/g,'-').toLowerCase();

            try {
                // Fetching from 3 JSON sources using Promise.all
                const jsonUrl1 = 'https://cdn.jsdelivr.net/gh/srhady/data@main/live_sports_playlist.json';
        const jsonUrl2 = 'https://cdn.jsdelivr.net/gh/srhady/crichd-speical-live-event@main/Live_Events.json';
        const jsonUrl3 = 'https://cdn.jsdelivr.net/gh/srhady/join_telegram_chennal-livesportsplay@main/custom.json';
                const timestamp = Math.floor(new Date().getTime() / 60000); 
 // বর্তমান সময়
                const [res1, res2, res3] = await Promise.all([
                    fetch(jsonUrl1 + "?t=" + timestamp).catch(() => null),
                    fetch(jsonUrl2 + "?t=" + timestamp).catch(() => null),
                    fetch(jsonUrl3 + "?t=" + timestamp).catch(() => null)
                ]);

                let data1 = res1 && res1.ok ? await res1.json() : [];
                let data2 = res2 && res2.ok ? await res2.json() : [];
                let data3 = res3 && res3.ok ? await res3.json() : [];

                // Normalizing Data Arrays
                data1 = Array.isArray(data1) ? data1 : (data1.channels ? data1.channels : []);
                data2 = Array.isArray(data2) ? data2 : (data2.matches ? data2.matches : [data2]);
                data3 = Array.isArray(data3) ? data3 : (data3.matches ? data3.matches : [data3]);

                // Map 1
                let mapped1 = data1.map(item => ({
                    "Match Title": item["Match Title"] || item["Watch Title"] || "Unknown",
                    "League": item["League"] || item["Category"] || "Other",
                    "Start Time": item["Start Time"] || "",
                    "Team 1 Logo": item["Team 1 Logo"], "Team 2 Logo": item["Team 2 Logo"],
                    "Streams": item["Streams"] || []
                }));

                // Map 2 (CricHD format)
                let mapped2 = data2.map(item => ({
                    "Match Title": item["match name"] || "Live Cricket Match",
                    "League": item["category"] || "Cricket",
                    "Start Time": item["Start time"] || "",
                    "Streams": (item["Channels"] || []).map(ch => ({
                        "Embed_URL": ch["Embed link"], "Quality": ch["Language"]
                    }))
                }));

                // Map 3 (Custom format)
                let mapped3 = data3.map(item => ({
                    "Match Title": item["Match Title"] || item["match name"] || "Live Match",
                    "League": item["Category"] || item["category"] || "Other",
                    "Start Time": item["Start Time"] || item["Start time"] || "",
                    "Streams": (item["Streams"] || item["Channels"] || []).map(ch => ({
                        "Embed_URL": ch["Embed_URL"] || ch["Embed link"], "Quality": ch["Quality"] || ch["Language"] || "HD"
                    }))
                }));

                const allMatches = [...mapped1, ...mapped2, ...mapped3];
                const matchData = allMatches.find(m => (m["Match Title"].split('|')[0].trim() === rawMatchTitle.split('|')[0].trim()));

                if (matchData) {
                    document.getElementById('match-title').innerText = matchData["Match Title"];
                    document.getElementById('league-name').innerText = matchData["League"] || "Live Sports";
                    document.getElementById('match-kickoff').innerText = "Kick off: " + (matchData["Start Time"] || "N/A");
                    
                    // VS Card Logic
                    const teamCardContainer = document.getElementById('vip-teams-card-container');
                    if (matchData["Team 1 Logo"] && matchData["Team 1 Logo"].trim() !== "") {
                        document.getElementById('team1-logo').src = matchData["Team 1 Logo"];
                        document.getElementById('team2-logo').src = matchData["Team 2 Logo"];
                        teamCardContainer.classList.remove("hidden");
                        teamCardContainer.classList.add("flex");
                    } else {
                        teamCardContainer.classList.add("hidden");
                    }

                    // Countdown Logic
                    const startTimeRaw = matchData["Start Time"] || "";
                    let countdownInterval;

                    function getMatchDateObj(bstString) {
                        if (!bstString || !bstString.includes("|")) return null;
                        try {
                            const [timePart, datePart] = bstString.split("|").map(s => s.trim());
                            const [day, monthStr] = datePart.split("-");
                            const monthMap = { "Jan":"01","Feb":"02","Mar":"03","Apr":"04","May":"05","Jun":"06","Jul":"07","Aug":"08","Sep":"09","Oct":"10","Nov":"11","Dec":"12" };
                            const month = monthMap[monthStr] || "01";
                            const year = new Date().getFullYear(); 
                            let [time, modifier] = timePart.split(" ");
                            let [hours, minutes] = time.split(":");
                            hours = parseInt(hours, 10);
                            if (hours === 12) hours = 0;
                            if (modifier && modifier.toUpperCase() === "PM") hours += 12;
                            return new Date(`${year}-${month}-${day.padStart(2, '0')}T${hours.toString().padStart(2, '0')}:${minutes.padStart(2, '0')}:00+06:00`);
                        } catch (e) { return null; }
                    }

                    const matchDate = getMatchDateObj(startTimeRaw);
                    const now = new Date();

                    if (matchDate && now.getTime() < matchDate.getTime() - 600000) {
                        const upcomingBox = document.getElementById('upcoming-box');
                        upcomingBox.classList.remove("hidden");

                        function updateCountdown() {
                            const diff = matchDate.getTime() - new Date().getTime();
                            if (diff <= 600000) { 
                                clearInterval(countdownInterval);
                                showLivePlayerAndServers(matchData);
                                return;
                            }
                            document.getElementById('cd-days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
                            document.getElementById('cd-hours').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                            document.getElementById('cd-minutes').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                            document.getElementById('cd-seconds').innerText = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
                        }
                        updateCountdown(); 
                        countdownInterval = setInterval(updateCountdown, 1000); 
                    } else {
                        showLivePlayerAndServers(matchData);
                    }

                    // Initialize Firebase Chat
                    initFirebaseChat();

                } else {
                    document.getElementById('match-title').innerText = "Match not found.";
                }
            } catch (error) {
                console.error("Error:", error);
            }
        });

        function showLivePlayerAndServers(matchData) {
            document.getElementById('upcoming-box').classList.add("hidden");
            const videoContainerBox = document.getElementById('sticky-video-wrapper');
            const serverContainer = document.getElementById('server-buttons');
            
            videoContainerBox.classList.remove("hidden");
            serverContainer.innerHTML = ""; 
            
            let allServerButtons = []; 

            if (matchData.Streams && matchData.Streams.length > 0) {
                matchData.Streams.forEach((stream, index) => {
                    const btn = document.createElement('button');
                    const baseClass = 'px-5 py-2.5 rounded-full text-sm font-semibold whitespace-nowrap border transition flex-shrink-0';
                    const inactiveClass = 'bg-slate-800 text-slate-100 border-slate-700 hover:bg-slate-700';
                    const activeClass = 'bg-[#ef4444] text-white border-[#ef4444] shadow-[0_0_10px_rgba(239,68,68,0.5)]';

                    if (index === 0) btn.className = `${baseClass} ${activeClass}`;
                    else btn.className = `${baseClass} ${inactiveClass}`;

                    btn.innerText = `▶ Server ${index + 1} (${stream.Quality || 'HD'})`;
                    
                    btn.onclick = () => { 
                        playStreamOnRightFrame(stream.Embed_URL); 
                        allServerButtons.forEach(b => b.className = `${baseClass} ${inactiveClass}`);
                        btn.className = `${baseClass} ${activeClass}`;
                    };
                    
                    allServerButtons.push(btn);
                    serverContainer.appendChild(btn);
                });
                
                // Play first stream automatically
                playStreamOnRightFrame(matchData.Streams[0].Embed_URL);
            } else {
                serverContainer.innerHTML = "<p style='color:#ef4444; padding:0 10px;'>এই মুহূর্তে কোনো লাইভ স্ট্রিম লিংক পাওয়া যায়নি!</p>";
            }
        }

        // ------------------ Chat Functions ------------------
        const chatBox = document.getElementById('chatMessages');
        function handleEnter(e){ if(e.key === 'Enter') postMessage(); }
        
        function postMessage(){
            let name = document.getElementById('chatName').value.trim();
            const text = document.getElementById('chatText').value.trim();
            if(!text) return;
            if(!name) name = "Guest";
            const newMsg = { author: name, text: text, time: new Date().getTime() };
            db.ref('chats/' + matchId).push(newMsg);
            document.getElementById('chatText').value = '';
        }
        
        let isFirstLoad = true;
        function initFirebaseChat(){
            db.ref('chats/' + matchId).limitToLast(100).on('value', snapshot => {
                const data = snapshot.val();
                if(!data) return;
                const isScrolledToBottom = chatBox.scrollHeight - chatBox.clientHeight <= chatBox.scrollTop + 50;
                chatBox.innerHTML = '<div class="text-center text-slate-500 text-xs mt-2 mb-4 bg-white/5 p-2 rounded-lg mx-4 border border-slate-700/50"><i class="fas fa-lock text-[10px] mr-1"></i> End-to-end encrypted VIP Chat</div>';
                
                Object.values(data).forEach(m => {
                    const timeStr = new Date(m.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    const initial = m.author.charAt(0).toUpperCase();
                    const colors = ['#ff2a5f', '#00f2fe', '#00e676', '#fca311', '#b100ff'];
                    const bgColor = colors[m.author.length % colors.length];
                    
                    const html = `
                    <div class="msg-item px-2">
                        <div class="msg-avatar" style="background: ${bgColor};">${initial}</div>
                        <div class="msg-content w-full max-w-[85%]">
                            <div class="msg-author">${m.author} <span class="msg-time">${timeStr}</span></div>
                            <div class="msg-text">${m.text}</div>
                        </div>
                    </div>`;
                    chatBox.insertAdjacentHTML('beforeend', html);
                });
                if(isFirstLoad || isScrolledToBottom){
                    chatBox.scrollTop = chatBox.scrollHeight;
                    isFirstLoad = false;
                }
            });
        }
    </script>
</body>
</html>
