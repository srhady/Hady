<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Live Stream | LiveSportsPlay</title> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"> 
    
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body> 
    <div class="container"> 
        <h3 id="match-title" class="title">Loading Match...</h3> 
        
        <div class="video-container"> 
            <iframe id="video-frame" src="" frameborder="0" allowfullscreen></iframe> 
        </div>

        <div class="info-row"> 
            <h2 id="league-name">League</h2> 
            <div class="share-icons"> 
                <a href="#" id="share-fb" target="_blank" class="fb"><i class="fab fa-facebook-f"></i></a> 
                <a href="#" id="share-wa" target="_blank" class="wa"><i class="fab fa-whatsapp"></i></a> 
                <a href="#" id="share-tg" target="_blank" class="tg"><i class="fab fa-telegram-plane"></i></a> 
            </div> 
        </div>

        <div class="streams-section"> 
            <p style="color: #94a3b8; margin-bottom: 10px;">Available Streams:</p> 
            <div id="server-buttons" class="server-list"> </div> 
        </div>

        <div class="teams-card"> 
            <img id="team1-logo" src="" alt="Team 1" onerror="this.style.display='none'"> 
            <div class="vs-badge">VS</div> 
            <img id="team2-logo" src="" alt="Team 2" onerror="this.style.display='none'"> 
        </div> 
    </div>

    <script src="app.js?v=2"></script>
</body>
</html>
