<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="no-referrer" />
  <title>Dream live - Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src='https://cdn.jwplayer.com/libraries/MAaRkUjT.js'></script>
  <script>jwplayer.key="jTL7dlu7ybUI5NZnDdVgb1laM8/Hj3ftIJ5Vqg==";</script>

  <style>
    :root { --bg-main: #0c121a; --bg-card: #17202c; --bg-pill: #121923; --sky-primary: #38bdf8; --sky-border: #0284c7; --pill-active-start: #0284c7; --pill-active-end: #0369a1; --text-white: #ffffff; --text-muted: #93a3b5; --live-green: #22c55e; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: #070b10; color: var(--text-white); font-family: 'Outfit', sans-serif; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; user-select: none; }
    .app-container { width: 100%; max-width: 450px; min-height: 100vh; background-color: var(--bg-main); padding-bottom: 28px; position: relative; box-shadow: 0 0 35px rgba(0, 0, 0, 0.8); }
    .app-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background-color: var(--bg-main); border-bottom: 1px solid #192434; position: sticky; top: 0; z-index: 60; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn { background: #151e2b; border: 1.5px solid var(--sky-border); color: #ffffff; width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; }
    .brand-title { font-size: 18px; font-weight: 700; color: #ffffff; }
    .live-pill { display: flex; align-items: center; gap: 6px; background: rgba(34, 197, 94, 0.15); border: 1px solid var(--live-green); color: var(--live-green); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
    .live-dot { width: 7px; height: 7px; background-color: var(--live-green); border-radius: 50%; animation: blink 1.1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .player-sticky-wrap { position: sticky; top: 59px; z-index: 50; background: #000; border-bottom: 2px solid var(--sky-primary); }
    .video-box { width: 100%; aspect-ratio: 16 / 9; background: #000000; position: relative; overflow: hidden; }
    #videoContainer, #embedFrame { width: 100%; height: 100%; border: none; background: #000; }
    #embedFrame { display: none; }
    .player-loader { position: absolute; inset: 0; background: rgba(7, 11, 16, 0.78); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; z-index: 25; pointer-events: none; }
    .player-loader.hidden { display: none; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(56, 189, 248, 0.25); border-top-color: var(--sky-primary); border-radius: 50%; animation: spin 0.75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { font-size: 12.5px; color: #e2e8f0; font-weight: 500; }
    .section-box { margin: 12px 10px; background-color: var(--bg-card); border: 2px solid var(--sky-primary); border-radius: 14px; padding: 12px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .section-title { font-size: 13.5px; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 6px; text-transform: uppercase; }
    .drm-status { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: rgba(56, 189, 248, 0.15); color: var(--sky-primary); border: 1px solid rgba(56, 189, 248, 0.4); }
    .servers-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .server-btn { height: 36px; padding: 0 13px; border-radius: 10px; background-color: var(--bg-pill); border: 1.5px solid var(--sky-border); color: var(--text-white); font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: all 0.15s ease; }
    .server-btn.active { background: linear-gradient(90deg, var(--pill-active-start) 0%, var(--pill-active-end) 100%); border-color: var(--sky-primary); box-shadow: 0 0 10px rgba(56, 189, 248, 0.35); }
    .server-tag { font-size: 9.5px; font-weight: 800; background: rgba(0, 0, 0, 0.35); color: #38bdf8; padding: 2px 5px; border-radius: 4px; }
    .server-btn.active .server-tag { color: #ffffff; background: rgba(255, 255, 255, 0.2); }
    .match-banner { margin: 10px; background-color: var(--bg-card); border: 2px solid var(--sky-primary); border-radius: 14px; padding: 10px 12px; }
    .banner-league { text-align: center; font-size: 11.5px; font-weight: 700; color: var(--sky-primary); text-transform: uppercase; margin-bottom: 8px; }
    .banner-teams { display: grid; grid-template-columns: 1fr 50px 1fr; align-items: center; gap: 6px; }
    .b-team { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .b-team.right { justify-content: flex-end; text-align: right; }
    .b-logo { width: 44px; height: 44px; border-radius: 50%; background: #101720; border: 2px solid #2e435c; overflow: hidden; flex-shrink: 0; }
    .b-logo img { width: 100%; height: 100%; object-fit: cover; }
    .b-name { font-size: 12.5px; font-weight: 600; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .vs-circle { width: 34px; height: 34px; margin: 0 auto; border-radius: 50%; background: #101720; border: 1px solid #2e435c; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: var(--sky-primary); }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-left"><a href="admin.html" class="back-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></a><span class="brand-title">Dream live</span></div>
      <div class="live-pill"><span class="live-dot"></span><span>LIVE PLAYER</span></div>
    </header>
    <div class="player-sticky-wrap">
      <div class="video-box">
        <div id="videoContainer"><div id="videoElement"></div></div>
        <!-- iframe-এ sandbox যোগ করা হয়েছে পপআপ ও রিডাইরেক্ট ব্লক করার জন্য -->
        <iframe id="embedFrame" sandbox="allow-scripts allow-same-origin allow-presentation" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        <div class="player-loader" id="playerLoader"><div class="spinner"></div><div class="loader-text" id="loaderText">Loading Stream...</div></div>
      </div>
    </div>
    <section class="section-box">
      <div class="section-head"><div class="section-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span>Select Server / Channel</span></div><span class="drm-status" id="streamTypeBadge">AUTO</span></div>
      <div class="servers-grid" id="serversGrid"></div>
    </section>
    <section class="match-banner" id="matchBanner">
      <div class="banner-league" id="bannerLeague">LOADING MATCH...</div>
      <div class="banner-teams">
        <div class="b-team"><div class="b-logo"><img id="logoA" src="" alt="" /></div><div class="b-name" id="nameA">Team A</div></div>
        <div class="vs-circle">VS</div>
        <div class="b-team right"><div class="b-name" id="nameB">Team B</div><div class="b-logo"><img id="logoB" src="" alt="" /></div></div>
      </div>
    </section>
  </div>

  <script>
    const API_URL = 'https://falconde-uqdj3fde.manus.space/api/geesports/events';
    let currentMatch = null, currentServerIndex = 0;

    function createFallbackBadge(name) {
      const clean = (name || 'DL').replace(/[^a-zA-Z0-9 ]/g, '').trim(), initials = clean.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || 'DL';
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96"><rect width="96" height="96" rx="48" fill="#101720"/><text x="48" y="56" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="700">${initials}</text></svg>`);
    }

    function sanitizeLogo(url, name) { return (!url || typeof url !== 'string') ? createFallbackBadge(name) : (url.trim().startsWith('http://') ? 'https://' + url.trim().slice(7) : url.trim()); }
    function showLoader(msg = 'Loading Stream...') { document.getElementById('loaderText').textContent = msg; document.getElementById('playerLoader').classList.remove('hidden'); }
    function hideLoader() { document.getElementById('playerLoader').classList.add('hidden'); }

    function buildDrmConfiguration(apiField) {
      if (!apiField || typeof apiField !== 'string') return null;
      const raw = apiField.trim();
      if (raw.startsWith('http')) return { type: 'WIDEVINE DRM', lic: raw };
      if (raw.includes(':')) { const parts = raw.split(',')[0].split(':').map(s => s.trim().toLowerCase()); if (parts.length === 2) return { type: 'CLEARKEY DRM', kid: parts[0], key: parts[1] }; }
      return null;
    }

    function playChannelStream(streamObj) {
      if (!streamObj) return;
      
      // পূর্বের সার্ভার পুরোপুরি স্টপ করা
      try {
        if (jwplayer("videoElement").getState() !== "idle") {
           jwplayer("videoElement").stop();
           jwplayer("videoElement").remove(); 
        }
      } catch (e) {}

      document.getElementById('videoContainer').innerHTML = '<div id="videoElement"></div>';

      let targetUrl = (streamObj.link || streamObj.url || (streamObj.tokenApi ? streamObj.tokenApi.api : "") || "").trim();
      if (!targetUrl) return;
      showLoader(`Connecting to Server...`);
      const embedFrame = document.getElementById('embedFrame'), videoContainer = document.getElementById('videoContainer'), badgeEl = document.getElementById('streamTypeBadge');
      
      if (targetUrl.includes('|')) targetUrl = targetUrl.split('|')[0].trim();
      
      let isEmbed = (streamObj.tokenApi && streamObj.tokenApi.type === 'embed') || targetUrl.includes('.html') || targetUrl.includes('/embed/') || (targetUrl.includes('/?url=') && !targetUrl.includes('.m3u8') && !targetUrl.includes('.mpd'));
      if (isEmbed) { 
        badgeEl.textContent = 'WEB EMBED'; 
        videoContainer.style.display = 'none'; 
        embedFrame.style.display = 'block'; 
        embedFrame.src = targetUrl; 
        setTimeout(hideLoader, 1500); 
        return; 
      }

      videoContainer.style.display = 'block'; embedFrame.style.display = 'none'; embedFrame.src = '';
      let drmApi = (streamObj.api || streamObj.key || streamObj.drm_key || "").trim();
      const drmInfo = buildDrmConfiguration(drmApi);
      badgeEl.textContent = drmInfo ? drmInfo.type : (streamObj.name && streamObj.name.includes('FHD') ? 'FHD STREAM' : 'HD STREAM');

      let setupConfig = { file: targetUrl, width: "100%", aspectratio: "16:9", autostart: true, cast: {} };
      if (drmInfo && drmInfo.type === 'CLEARKEY DRM') { setupConfig.type = 'dash'; setupConfig.drm = { clearkey: { keyId: drmInfo.kid, key: drmInfo.key } }; }
      else if (drmInfo && drmInfo.type === 'WIDEVINE DRM') { setupConfig.type = 'dash'; setupConfig.drm = { widevine: { url: drmInfo.lic } }; }

      jwplayer("videoElement").setup(setupConfig);
      jwplayer("videoElement").on('ready', hideLoader); jwplayer("videoElement").on('play', hideLoader);
      jwplayer("videoElement").on('error', () => { showLoader('Stream Error / Offline'); });
    }

    function extractStreams(ev) { return (ev.linksDecoded && Array.isArray(ev.linksDecoded.data) && ev.linksDecoded.data.length > 0) ? ev.linksDecoded.data : (Array.isArray(ev.channels) ? ev.channels : (Array.isArray(ev.links) ? ev.links : (Array.isArray(ev.streams) ? ev.streams : []))); }

    async function selectMatch(matchObj, chIndex = 0) {
      currentMatch = matchObj; currentServerIndex = chIndex;
      document.getElementById('bannerLeague').textContent = `${matchObj.category || 'SPORTS'} • ${matchObj.eventName || 'LIVE'}`;
      document.getElementById('nameA').textContent = matchObj.teamAName || 'Team A'; document.getElementById('nameB').textContent = matchObj.teamBName || 'Team B';
      const lgA = document.getElementById('logoA'), lgB = document.getElementById('logoB');
      lgA.src = sanitizeLogo(matchObj.teamAFlag, matchObj.teamAName); lgA.onerror = () => { lgA.src = createFallbackBadge(matchObj.teamAName); };
      lgB.src = sanitizeLogo(matchObj.teamBFlag, matchObj.teamBName); lgB.onerror = () => { lgB.src = createFallbackBadge(matchObj.teamBName); };

      let streams = extractStreams(matchObj);
      if (streams.length === 0 && matchObj.links && typeof matchObj.links === 'string' && matchObj.links.startsWith('http')) {
        showLoader('Decrypting Channels...');
        try { const res = await fetch(matchObj.links); const decJson = await res.json(); const list = Array.isArray(decJson) ? decJson : (decJson.data || []); if (list.length > 0) { matchObj.linksDecoded = { data: list }; streams = list; } } catch (e) { console.error("Decrypt error", e); }
      }

      renderServerButtons(streams);
      if (streams.length > 0) switchServer(Math.min(chIndex, streams.length - 1)); else showLoader('No channel sources found.');
    }

    function renderServerButtons(streams) {
      document.getElementById('serversGrid').innerHTML = (!streams || streams.length === 0) ? `<div style="color:#ef4444;font-size:12.5px;font-weight:600;">No active channels found!</div>` : streams.map((st, idx) => `<button class="server-btn ${idx === currentServerIndex ? 'active' : ''}" onclick="switchServer(${idx})"><span>${(st.name || st.server || `Server ${idx + 1}`).trim()}</span><span class="server-tag">${(st.api ? 'DRM' : (st.tokenApi && st.tokenApi.type === 'embed' ? 'EMBED' : 'HD'))}</span></button>`).join('');
    }

    window.switchServer = function(index) { 
      const streams = extractStreams(currentMatch); 
      if (!streams[index]) return; 
      currentServerIndex = index; 
      renderServerButtons(streams); 
      playChannelStream(streams[index]); 
    };

    async function bootPlayer() {
      let savedSelection = null;
      try { savedSelection = JSON.parse(localStorage.getItem('dreamlive_selected_match')); } catch(e){}
      const params = new URLSearchParams(window.location.search), tA = params.get('teamA'), cIdx = parseInt(params.get('ch') || '0', 10);
      
      showLoader('Loading Match Data...');
      try {
        const res = await fetch(API_URL, { cache: 'no-store' });
        const json = await res.json(), rawList = Array.isArray(json) ? json : (json.events || json.data || []);
        let allMatches = rawList.map(item => item.event || item).filter(ev => ev && ev.teamAName && ev.visible !== false);
        
        let target = savedSelection;
        if (allMatches.length > 0) {
          if (tA) { const f = allMatches.find(m => m.teamAName.toLowerCase() === tA.toLowerCase()); if(f) target = f; }
          else if (savedSelection) { const f = allMatches.find(m => m.teamAName === savedSelection.teamAName); if(f) target = f; }
        }
        await selectMatch(target || allMatches[0], cIdx);
      } catch (err) {
        if (savedSelection) await selectMatch(savedSelection, cIdx); else showLoader('Failed to load data.');
      }
    }
    
    bootPlayer();
  </script>
</body>
</html>
