<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="no-referrer" />
  <title>Dream live - Player</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Shaka Player CSS & JS (For DASH .mpd & ClearKey/Widevine DRM) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
  <!-- HLS.js (Fallback for .m3u8 streams) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>

  <style>
    :root {
      --bg-main: #0c121a;
      --bg-card: #17202c;
      --bg-pill: #121923;
      --sky-primary: #38bdf8;
      --sky-border: #0284c7;
      --pill-active-start: #0284c7;
      --pill-active-end: #0369a1;
      --text-white: #ffffff;
      --text-muted: #93a3b5;
      --live-green: #22c55e;
      --badge-red: #e52521;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #070b10;
      color: var(--text-white);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    .app-container {
      width: 100%;
      max-width: 450px;
      min-height: 100vh;
      background-color: var(--bg-main);
      padding-bottom: 28px;
      position: relative;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
    }

    /* Top Header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background-color: var(--bg-main);
      border-bottom: 1px solid #192434;
      position: sticky;
      top: 0;
      z-index: 60;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: #151e2b;
      border: 1.5px solid var(--sky-border);
      color: #ffffff;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
    }

    .live-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid var(--live-green);
      color: var(--live-green);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background-color: var(--live-green);
      border-radius: 50%;
      animation: blink 1.1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Video Player Sticky Wrapper */
    .player-sticky-wrap {
      position: sticky;
      top: 59px;
      z-index: 50;
      background: #000;
      border-bottom: 2px solid var(--sky-primary);
    }

    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      position: relative;
      overflow: hidden;
    }

    #videoContainer,
    #videoElement,
    #embedFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    #embedFrame {
      display: none;
    }

    .player-loader {
      position: absolute;
      inset: 0;
      background: rgba(7, 11, 16, 0.78);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 25;
      pointer-events: none;
    }

    .player-loader.hidden {
      display: none;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(56, 189, 248, 0.25);
      border-top-color: var(--sky-primary);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-text {
      font-size: 12.5px;
      color: #e2e8f0;
      font-weight: 500;
    }

    /* Server Switcher Section */
    .section-box {
      margin: 12px 10px;
      background-color: var(--bg-card);
      border: 2px solid var(--sky-primary);
      border-radius: 14px;
      padding: 12px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .drm-status {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--sky-primary);
      border: 1px solid rgba(56, 189, 248, 0.4);
    }

    .servers-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .server-btn {
      height: 36px;
      padding: 0 13px;
      border-radius: 10px;
      background-color: var(--bg-pill);
      border: 1.5px solid var(--sky-border);
      color: var(--text-white);
      font-size: 12.5px;
      font-weight: 600;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .server-btn.active {
      background: linear-gradient(90deg, var(--pill-active-start) 0%, var(--pill-active-end) 100%);
      border-color: var(--sky-primary);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.35);
    }

    .server-tag {
      font-size: 9.5px;
      font-weight: 800;
      background: rgba(0, 0, 0, 0.35);
      color: #38bdf8;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .server-btn.active .server-tag {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.2);
    }

    /* Match Banner Card */
    .match-banner {
      margin: 10px;
      background-color: var(--bg-card);
      border: 2px solid var(--sky-primary);
      border-radius: 14px;
      padding: 10px 12px;
    }

    .banner-league {
      text-align: center;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--sky-primary);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .banner-teams {
      display: grid;
      grid-template-columns: 1fr 50px 1fr;
      align-items: center;
      gap: 6px;
    }

    .b-team {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .b-team.right {
      justify-content: flex-end;
      text-align: right;
    }

    .b-logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #101720;
      border: 2px solid #2e435c;
      overflow: hidden;
      flex-shrink: 0;
    }

    .b-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .b-name {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .vs-circle {
      width: 34px;
      height: 34px;
      margin: 0 auto;
      border-radius: 50%;
      background: #101720;
      border: 1px solid #2e435c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: var(--sky-primary);
    }

    /* Other Matches List */
    .other-matches-title {
      padding: 4px 12px 8px;
      font-size: 14px;
      font-weight: 700;
      color: #e2e8f0;
    }

    .mini-list {
      padding: 0 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mini-card {
      background: var(--bg-card);
      border: 1.5px solid #263649;
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .mini-card.current {
      border-color: var(--sky-primary);
      background: #1a2636;
    }

    .mini-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .mini-teams {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }

    .mini-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .play-now-btn {
      background: rgba(56, 189, 248, 0.14);
      color: var(--sky-primary);
      border: 1px solid var(--sky-border);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 1. Header -->
    <header class="app-header">
      <div class="header-left">
        <a href="admin.html" class="back-btn" aria-label="Back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </a>
        <span class="brand-title">Dream live</span>
      </div>
      <div class="live-pill">
        <span class="live-dot"></span>
        <span>LIVE PLAYER</span>
      </div>
    </header>

    <!-- 2. Video Player (Supports DASH DRM .mpd, HLS .m3u8 & Embed) -->
    <div class="player-sticky-wrap">
      <div class="video-box">
        <div data-shaka-player-container id="videoContainer">
          <video autoplay playsinline data-shaka-player id="videoElement"></video>
        </div>
        <iframe id="embedFrame" allowfullscreen allow="autoplay; encrypted-media"></iframe>

        <div class="player-loader" id="playerLoader">
          <div class="spinner"></div>
          <div class="loader-text" id="loaderText">Loading Stream...</div>
        </div>
      </div>
    </div>

    <!-- 3. Server / Channel Switcher -->
    <section class="section-box">
      <div class="section-head">
        <div class="section-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          <span>Select Server / Channel</span>
        </div>
        <span class="drm-status" id="streamTypeBadge">AUTO</span>
      </div>
      <div class="servers-grid" id="serversGrid"></div>
    </section>

    <!-- 4. Current Match Info Banner -->
    <section class="match-banner" id="matchBanner">
      <div class="banner-league" id="bannerLeague">LOADING MATCH...</div>
      <div class="banner-teams">
        <div class="b-team">
          <div class="b-logo"><img id="logoA" src="" alt="" /></div>
          <div class="b-name" id="nameA">Team A</div>
        </div>
        <div class="vs-circle">VS</div>
        <div class="b-team right">
          <div class="b-name" id="nameB">Team B</div>
          <div class="b-logo"><img id="logoB" src="" alt="" /></div>
        </div>
      </div>
    </section>

    <!-- 5. Other Matches Quick Switch -->
    <div class="other-matches-title">More Matches</div>
    <div class="mini-list" id="otherMatchesList"></div>
  </div>

  <script>
    // Full Decrypt API that includes linksDecoded (with DRM keys & m3u8/mpd links)
    const DECRYPT_API_URL = 'https://falconde-uqdj3fde.manus.space/api/decrypt';

    let shakaPlayer = null;
    let shakaUi = null;
    let hlsInstance = null;
    let allMatches = [];
    let currentMatch = null;
    let currentServerIndex = 0;

    // Fallback SVG Logo
    function createFallbackBadge(name) {
      const clean = (name || 'DL').replace(/[^a-zA-Z0-9 ]/g, '').trim();
      const initials = clean.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || 'DL';
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
        <rect width="96" height="96" rx="48" fill="#101720"/>
        <text x="48" y="56" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="700">${initials}</text>
      </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function sanitizeLogo(url, name) {
      if (!url || typeof url !== 'string') return createFallbackBadge(name);
      let clean = url.trim();
      if (clean.startsWith('http://')) clean = 'https://' + clean.slice(7);
      return clean;
    }

    function showLoader(msg = 'Loading Stream...') {
      const loader = document.getElementById('playerLoader');
      document.getElementById('loaderText').textContent = msg;
      loader.classList.remove('hidden');
    }

    function hideLoader() {
      document.getElementById('playerLoader').classList.add('hidden');
    }

    // =====================================================================
    // 1. INITIALIZE SHAKA PLAYER (FOR DASH .MPD + CLEARKEY / WIDEVINE DRM)
    // =====================================================================
    async function initShaka() {
      shaka.polyfill.installAll();
      if (!shaka.Player.isBrowserSupported()) {
        console.warn('Shaka Player not supported on this browser');
        return;
      }
      const video = document.getElementById('videoElement');
      const container = document.getElementById('videoContainer');
      shakaPlayer = new shaka.Player();
      await shakaPlayer.attach(video);

      shakaUi = new shaka.ui.Overlay(shakaPlayer, container, video);
      shakaUi.configure({
        controlPanelElements: [
          'play_pause',
          'time_and_duration',
          'spacer',
          'mute',
          'volume',
          'quality',
          'fullscreen'
        ]
      });

      shakaPlayer.addEventListener('error', (event) => {
        console.warn('Shaka Error:', event.detail);
      });

      video.addEventListener('playing', hideLoader);
      video.addEventListener('canplay', hideLoader);
    }

    // Parse ClearKey (kid:key) or Widevine License URL from the "api" field
    function buildDrmConfiguration(apiField) {
      if (!apiField || typeof apiField !== 'string') return null;
      const raw = apiField.trim();
      if (!raw) return null;

      // Case 1: Widevine / PlayReady License Server URL
      if (raw.startsWith('http://') || raw.startsWith('https://')) {
        return {
          type: 'WIDEVINE DRM',
          drmConfig: {
            servers: {
              'com.widevine.alpha': raw,
              'com.microsoft.playready': raw
            }
          }
        };
      }

      // Case 2: ClearKey Hex Format "kid:key" (or multiple comma-separated pairs)
      if (raw.includes(':')) {
        const clearKeys = {};
        raw.split(',').forEach(pair => {
          const parts = pair.split(':').map(s => s.trim().toLowerCase());
          if (parts.length === 2 && parts[0] && parts[1]) {
            clearKeys[parts[0]] = parts[1];
          }
        });
        if (Object.keys(clearKeys).length > 0) {
          return {
            type: 'CLEARKEY DRM',
            drmConfig: { clearKeys }
          };
        }
      }

      return null;
    }

    // Clean pipe parameters like ".m3u8|Referer=https://..."
    function cleanStreamUrl(rawUrl) {
      if (!rawUrl || typeof rawUrl !== 'string') return '';
      return rawUrl.split('|')[0].trim();
    }

    // =====================================================================
    // 2. UNIVERSAL STREAM PLAYER (DRM MPD + HLS M3U8 + IFRAME FALLBACK)
    // =====================================================================
    async function playChannelStream(streamObj) {
      if (!streamObj || !streamObj.link) return;

      showLoader(`Connecting to ${streamObj.name || 'Server'}...`);

      const videoContainer = document.getElementById('videoContainer');
      const videoEl = document.getElementById('videoElement');
      const embedFrame = document.getElementById('embedFrame');
      const badgeEl = document.getElementById('streamTypeBadge');

      // Cleanup previous instances
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      if (shakaPlayer) {
        try { await shakaPlayer.unload(); } catch (e) {}
      }
      embedFrame.src = 'about:blank';
      embedFrame.style.display = 'none';
      videoContainer.style.display = 'block';

      let streamUrl = cleanStreamUrl(streamObj.link);
      const drmInfo = buildDrmConfiguration(streamObj.api);

      // Check if it's an HTML / Embed page (like fctv33 / web player links)
      const isEmbedPage =
        (streamUrl.includes('.html') || streamUrl.includes('/?url=')) &&
        !streamUrl.includes('.m3u8') &&
        !streamUrl.includes('.mpd');

      if (isEmbedPage) {
        badgeEl.textContent = 'WEB EMBED';
        videoContainer.style.display = 'none';
        embedFrame.style.display = 'block';
        embedFrame.src = streamUrl;
        setTimeout(hideLoader, 1500);
        return;
      }

      // Case A: DASH (.mpd) or DRM-protected stream -> Play with Shaka Player
      if (streamUrl.includes('.mpd') || drmInfo) {
        badgeEl.textContent = drmInfo ? drmInfo.type : 'DASH STREAM';

        if (!shakaPlayer) await initShaka();

        shakaPlayer.resetConfiguration();
        if (drmInfo) {
          shakaPlayer.configure({
            drm: drmInfo.drmConfig,
            streaming: {
              bufferingGoal: 12,
              rebufferingGoal: 2,
              lowLatencyMode: true
            }
          });
        }

        try {
          await shakaPlayer.load(streamUrl);
          videoEl.play().catch(() => {});
          hideLoader();
          return;
        } catch (err) {
          console.error('Shaka load failed, trying fallback:', err);
        }
      }

      // Case B: HLS (.m3u8) stream -> Play with HLS.js or Native HLS
      badgeEl.textContent = streamObj.linkTag || 'HLS HD';

      if (Hls.isSupported()) {
        hlsInstance = new Hls({
          enableWorker: true,
          lowLatencyMode: true
        });
        hlsInstance.loadSource(streamUrl);
        hlsInstance.attachMedia(videoEl);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          videoEl.play().catch(() => {});
          hideLoader();
        });
        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            // Try Shaka as backup for HLS
            if (shakaPlayer) {
              shakaPlayer.load(streamUrl).then(hideLoader).catch(() => {
                showLoader('Stream Offline or Geo-Blocked (Try another server)');
              });
            }
          }
        });
      } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
        videoEl.src = streamUrl;
        videoEl.addEventListener('loadedmetadata', () => {
          videoEl.play().catch(() => {});
          hideLoader();
        }, { once: true });
      }
    }

    // =====================================================================
    // 3. RENDER SERVERS & MATCH DETAILS
    // =====================================================================
    function extractStreamsFromEvent(ev) {
      // 1. Check linksDecoded.data
      if (ev.linksDecoded && Array.isArray(ev.linksDecoded.data) && ev.linksDecoded.data.length > 0) {
        return ev.linksDecoded.data;
      }
      // 2. Check direct array
      if (Array.isArray(ev.streams) && ev.streams.length > 0) {
        return ev.streams;
      }
      return [];
    }

    async function selectMatch(matchObj, preferredChannelIndex = 0) {
      currentMatch = matchObj;
      currentServerIndex = preferredChannelIndex;

      // Update Banner UI
      document.getElementById('bannerLeague').textContent =
        `${matchObj.category || 'SPORTS'} • ${matchObj.eventName || 'LIVE'}`;
      document.getElementById('nameA').textContent = matchObj.teamAName || 'Team A';
      document.getElementById('nameB').textContent = matchObj.teamBName || 'Team B';

      const logoAEl = document.getElementById('logoA');
      const logoBEl = document.getElementById('logoB');
      logoAEl.src = sanitizeLogo(matchObj.teamAFlag, matchObj.teamAName);
      logoAEl.onerror = () => { logoAEl.src = createFallbackBadge(matchObj.teamAName); };
      logoBEl.src = sanitizeLogo(matchObj.teamBFlag, matchObj.teamBName);
      logoBEl.onerror = () => { logoBEl.src = createFallbackBadge(matchObj.teamBName); };

      // Check if we already have decoded links; if not, fetch from matchObj.links
      let streams = extractStreamsFromEvent(matchObj);
      if (streams.length === 0 && matchObj.links && matchObj.links.startsWith('http')) {
        showLoader('Decrypting Channels...');
        try {
          const res = await fetch(matchObj.links);
          const decJson = await res.json();
          const list = Array.isArray(decJson) ? decJson : (decJson.data || []);
          if (list.length > 0) {
            matchObj.linksDecoded = { data: list };
            streams = list;
          }
        } catch (e) {
          console.warn('Single link decrypt fetch failed:', e);
        }
      }

      renderServerButtons(streams);
      renderOtherMatches();

      if (streams.length > 0) {
        const idx = Math.min(preferredChannelIndex, streams.length - 1);
        switchServer(idx);
      } else {
        showLoader('No active stream links found for this match');
      }
    }

    function renderServerButtons(streams) {
      const grid = document.getElementById('serversGrid');
      if (!streams || streams.length === 0) {
        grid.innerHTML = `<div style="color:#93a3b5;font-size:12.5px;">No servers available right now.</div>`;
        return;
      }

      grid.innerHTML = streams.map((st, idx) => {
        const name = (st.name || `Server ${idx + 1}`).trim();
        const tag = (st.linkTag || st.tag || (st.api ? 'DRM' : 'HD')).trim();
        return `
          <button class="server-btn ${idx === currentServerIndex ? 'active' : ''}" onclick="switchServer(${idx})">
            <span>${name}</span>
            <span class="server-tag">${tag}</span>
          </button>
        `;
      }).join('');
    }

    window.switchServer = function(index) {
      const streams = extractStreamsFromEvent(currentMatch);
      if (!streams[index]) return;
      currentServerIndex = index;
      renderServerButtons(streams);
      playChannelStream(streams[index]);
    };

    function renderOtherMatches() {
      const container = document.getElementById('otherMatchesList');
      container.innerHTML = allMatches.slice(0, 15).map((m, i) => {
        const isCurrent = currentMatch &&
          m.teamAName === currentMatch.teamAName &&
          m.teamBName === currentMatch.teamBName;
        return `
          <div class="mini-card ${isCurrent ? 'current' : ''}" onclick="selectMatchByIndex(${i})">
            <div class="mini-info">
              <div class="mini-teams">${m.teamAName} vs ${m.teamBName || ''}</div>
              <div class="mini-sub">${m.category} • ${m.eventName}</div>
            </div>
            <span class="play-now-btn">${isCurrent ? 'Playing' : 'Watch'}</span>
          </div>
        `;
      }).join('');
    }

    window.selectMatchByIndex = function(idx) {
      if (allMatches[idx]) {
        selectMatch(allMatches[idx], 0);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    };

    // =====================================================================
    // 4. BOOTSTRAP: CHECK URL PARAMS / LOCALSTORAGE & FETCH DECRYPT API
    // =====================================================================
    async function bootPlayer() {
      await initShaka();

      const params = new URLSearchParams(window.location.search);
      const directUrl = params.get('url');
      const directKey = params.get('key') || params.get('drm') || '';
      const chParam = parseInt(params.get('ch') || '0', 10) || 0;
      const teamAParam = params.get('teamA') || '';

      // 1. If a direct ?url=...(&key=kid:key) is passed in URL, play immediately
      if (directUrl) {
        const customStream = {
          name: 'Direct Stream',
          link: directUrl,
          api: directKey,
          linkTag: directKey ? 'DRM' : 'HD'
        };
        currentMatch = {
          category: 'Live Stream',
          eventName: 'Direct Playback',
          teamAName: 'Stream',
          teamBName: 'Live',
          linksDecoded: { data: [customStream] }
        };
        selectMatch(currentMatch, 0);
        return;
      }

      // 2. Check if match was passed from admin.html via localStorage
      let savedSelection = null;
      try {
        const rawSaved = localStorage.getItem('dreamlive_selected_match');
        if (rawSaved) savedSelection = JSON.parse(rawSaved);
      } catch (e) {}

      // 3. Fetch full decrypted match list from API
      showLoader('Loading Match Streams...');
      try {
        const res = await fetch(DECRYPT_API_URL, { cache: 'no-store' });
        const json = await res.json();
        const rawList = Array.isArray(json) ? json : (json.events || json.data || []);

        allMatches = rawList
          .map(item => item.event || item)
          .filter(ev => ev && ev.teamAName && ev.visible !== false);

        if (allMatches.length > 0) {
          let targetMatch = null;
          let targetChIndex = chParam;

          if (teamAParam) {
            targetMatch = allMatches.find(
              m => m.teamAName.toLowerCase() === teamAParam.toLowerCase()
            );
          } else if (savedSelection && savedSelection.teamAName) {
            targetMatch = allMatches.find(
              m => m.teamAName === savedSelection.teamAName &&
                   m.teamBName === savedSelection.teamBName
            );
            if (typeof savedSelection.channelIndex === 'number') {
              targetChIndex = savedSelection.channelIndex;
            }
          }

          await selectMatch(targetMatch || allMatches[0], targetChIndex);
        } else if (savedSelection) {
          await selectMatch(savedSelection, savedSelection.channelIndex || 0);
        }
      } catch (err) {
        console.error('Failed to load decrypt API:', err);
        if (savedSelection) {
          await selectMatch(savedSelection, savedSelection.channelIndex || 0);
        } else {
          showLoader('Failed to load stream data.');
        }
      }
    }

    bootPlayer();
  </script>
</body>
</html>
