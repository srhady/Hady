<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Series</title>
    <style>
        /* Netflix Style CSS */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #141414; color: #fff; overflow-x: hidden; }
        
        /* Hero Banner */
        .hero { position: relative; height: 85vh; background-size: cover; background-position: center; display: flex; align-items: center; }
        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to right, rgba(20,20,20,0.9) 0%, rgba(20,20,20,0.4) 50%, rgba(20,20,20,0.1) 100%); }
        .hero-bottom-fade { position: absolute; bottom: 0; left: 0; width: 100%; height: 150px; background: linear-gradient(to bottom, rgba(20,20,20,0) 0%, #141414 100%); }
        
        .hero-content { position: relative; z-index: 10; padding: 0 4%; max-width: 60%; }
        .hero-title { font-size: 3.5rem; font-weight: 800; margin-bottom: 15px; text-transform: uppercase; }
        .hero-meta { display: flex; gap: 15px; margin-bottom: 15px; font-size: 1.1rem; color: #a3a3a3; font-weight: bold; }
        .match-tag { border: 1px solid #a3a3a3; padding: 1px 5px; border-radius: 3px; }
        .hero-desc { font-size: 1.2rem; line-height: 1.5; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

        /* Episodes Section */
        .episodes-section { position: relative; z-index: 10; padding: 0 4%; margin-top: -80px; }
        .section-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 20px; }
        
        .episodes-grid { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 20px; scrollbar-width: none; }
        .episodes-grid::-webkit-scrollbar { display: none; }
        
        .episode-card { flex: 0 0 300px; background: #181818; border-radius: 4px; cursor: pointer; transition: transform 0.3s; position: relative; text-decoration: none; color: inherit; }
        .episode-card:hover { transform: scale(1.05); z-index: 2; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .ep-img { width: 100%; height: 168px; object-fit: cover; border-radius: 4px 4px 0 0; }
        .play-icon { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; color: rgba(255,255,255,0.7); opacity: 0; transition: opacity 0.3s; }
        .episode-card:hover .play-icon { opacity: 1; }
        
        .ep-info { padding: 15px; }
        .ep-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .ep-title { font-size: 1rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%; }
        .ep-duration { font-size: 0.9rem; color: #a3a3a3; }
        .ep-desc { font-size: 0.85rem; color: #808080; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body>

    <div id="heroBanner" class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-bottom-fade"></div>
        <div class="hero-content">
            <h1 id="heroTitle" class="hero-title">Loading...</h1>
            <div class="hero-meta">
                <span id="heroYear"></span>
                <span class="match-tag" id="heroAge">18+</span>
                <span id="heroSeasons">1 Season</span>
            </div>
            <p id="heroDesc" class="hero-desc"></p>
        </div>
    </div>

    <div class="episodes-section">
        <h2 class="section-title">Episodes</h2>
        <div class="episodes-grid" id="episodesList">
            <!-- Episodes injected here -->
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://sonyliv-api-1.onrender.com"; // আপনার রেন্ডার API

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const response = await fetch(`${API_BASE_URL}/api/series`);
                const data = await response.json();
                
                const bundleData = data.resultObj.containers[0];
                const meta = bundleData.metadata;
                const episodes = bundleData.containers;

                // Set Hero Banner
                const bgImage = meta.tv_background_image || meta.detail_cover_bg;
                document.getElementById('heroBanner').style.backgroundImage = `url('${bgImage}')`;
                document.getElementById('heroTitle').innerText = meta.title === "Season 1" ? "Scam 1992" : meta.title;
                document.getElementById('heroYear').innerText = meta.release_year || "2020";
                document.getElementById('heroAge').innerText = meta["18+"] ? "18+" : "U/A";
                document.getElementById('heroDesc').innerText = meta.shortDescription;

                // Load Episodes
                const epListContainer = document.getElementById('episodesList');
                episodes.forEach(ep => {
                    const epMeta = ep.metadata;
                    
                    // এখানে sliv.player.html এ ডাইরেক্ট করা হচ্ছে ID সহ
                    const aTag = document.createElement('a');
                    aTag.href = `sliv.player.html?id=${epMeta.contentId}&title=${encodeURIComponent(epMeta.episodeTitle)}`;
                    aTag.className = 'episode-card';

                    aTag.innerHTML = `
                        <div style="position: relative;">
                            <img class="ep-img" src="${epMeta.landscape_thumb}" alt="${epMeta.episodeTitle}">
                            <div class="play-icon">▶</div>
                        </div>
                        <div class="ep-info">
                            <div class="ep-header">
                                <span class="ep-title">${epMeta.episodeNumber}. ${epMeta.episodeTitle}</span>
                                <span class="ep-duration">${(epMeta.duration / 60).toFixed(0)}m</span>
                            </div>
                            <p class="ep-desc">${epMeta.shortDescription}</p>
                        </div>
                    `;
                    epListContainer.appendChild(aTag);
                });
            } catch (error) {
                console.error("Error loading series data", error);
            }
        });
    </script>
</body>
</html>
