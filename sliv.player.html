
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090d">
<title>Premium Player</title>
<script src="https://cdn.jwplayer.com/libraries/MAaRkUjT.js"></script>
<script>jwplayer.key="YOUR_JWPLAYER_LICENSE_KEY";</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08090d;color:white;font-family:Arial;overflow:hidden}
#app{height:100dvh;width:100%;position:relative;background:#000}
#player{position:absolute;inset:0;width:100%;height:100%}
header{position:absolute;z-index:5;top:0;width:100%;padding:25px;background:linear-gradient(#000c,transparent);display:flex;align-items:center;gap:15px;transition:.3s}
header.hide{opacity:0;pointer-events:none}
.back{color:white;text-decoration:none;font-size:30px}
h3{font-size:17px;max-width:75vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#loading,#error{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;background:#08090d;text-align:center;padding:20px}
#error{display:none}
.spin{width:42px;height:42px;border:3px solid #333;border-top-color:#e50914;border-radius:50%;animation:rotate .8s linear infinite}
@keyframes rotate{to{transform:rotate(360deg)}}
button{background:#e50914;color:white;border:0;padding:13px 25px;border-radius:7px;font-weight:bold}
p{color:#aaa;font-size:13px}
</style>
</head>
<body>
<div id="app">
<header id="header">
<a class="back" href="sliv.html">←</a>
<h3 id="title">Loading episode...</h3>
</header>
<div id="player"></div>
<div id="loading"><div class="spin"></div><b>PREPARING STREAM</b><p id="status">Connecting...</p></div>
<div id="error"><h2>Unable to Play</h2><p id="errmsg"></p><button onclick="loadStream()">RETRY</button></div>
</div>
<script>
const API="https://sonyliv-api-1.onrender.com";
const params=new URLSearchParams(location.search);
const id=params.get("id");
document.getElementById("title").textContent=params.get("title")||"Episode Playback";
const $=id=>document.getElementById(id);
let timer;
function controls(){
$("header").classList.remove("hide");
clearTimeout(timer);
timer=setTimeout(()=>$("header").classList.add("hide"),3500);
}
["mousemove","touchstart","keydown"].forEach(e=>document.addEventListener(e,controls));
function loading(s){$("status").textContent=s;$("loading").style.display="flex";$("error").style.display="none";}
function fail(e){$("loading").style.display="none";$("error").style.display="flex";$("errmsg").textContent=e;}
async function loadStream(){
if(!id)return fail("Episode ID missing.");
loading("Connecting to API...");
try{
if(window.jwplayer){try{jwplayer("player").remove();}catch(e){}}
const r=await fetch(`${API}/api/play?id=${encodeURIComponent(id)}`);
if(!r.ok)throw Error("API HTTP "+r.status);
const d=await r.json();
if(!d.url)throw Error("MPD URL missing.");
if(d.drm==="widevine"&&!d.drm_license_url)throw Error("Widevine license URL missing.");
const drmEnabled=d.drm==="widevine"||!!d.drm_license_url;
const config={
file:d.url,type:"dash",width:"100%",height:"100%",
controls:true,autostart:false,preload:"metadata",
stretching:"uniform",
tracks:(d.subtitles||[]).filter(s=>s.url).map(s=>({file:s.url,label:s.label||s.language,kind:"captions"}))
};
if(drmEnabled)config.drm={widevine:{url:d.drm_license_url}};
console.log("PLAYER DEBUG",{type:d.type,drm:d.drm,licensePresent:!!d.drm_license_url,config});
const p=jwplayer("player");
p.setup(config);
p.on("ready",()=>{loading("Press Play to start");});
p.on("play",()=>$("loading").style.display="none");
p.on("buffer",()=>loading("Buffering..."));
p.on("error",e=>{console.error("JW ERROR",e);fail(e.message||"Playback error");});
p.on("setupError",e=>{console.error("SETUP ERROR",e);fail(e.message||"Player setup error");});
}catch(e){console.error("STREAM ERROR",e);fail(e.message);}
}
controls();
loadStream();
</script>
</body>
</html>
