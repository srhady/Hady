
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WILLOW LIVE - Match Center</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jwplayer.com/libraries/MAaRkUjT.js"></script>
<script>jwplayer.key="jTL7dlu7ybUI5NZnDdVgb1laM8/Hj3ftIJ5Vqg==";</script>
<style>
body{font-family:Inter,Arial,sans-serif;background:#f1f5f9;color:#1e293b}
.pulse-dot{animation:pulse 1.5s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #ef444455}}
.match-card{transition:.25s}
.match-card:hover{transform:translateY(-4px);box-shadow:0 12px 24px #0002}
.player-modal-backdrop{display:none;position:fixed;inset:0;background:#ffffffdd;backdrop-filter:blur(5px);z-index:9999;align-items:center;justify-content:center}
.player-modal-content{background:white;border:1px solid #e2e8f0;border-radius:16px;width:95%;max-width:1000px;max-height:95vh;overflow-y:auto}
</style>
</head>
<body class="pb-16 antialiased">
<nav class="bg-white border-b sticky top-0 z-50 shadow-sm">
<div class="flex justify-center h-16 items-center">
<div class="flex items-center gap-2">
<span class="bg-emerald-600 text-white w-9 h-9 rounded flex items-center justify-center font-extrabold text-2xl">W</span>
<span class="font-extrabold text-2xl tracking-tight text-slate-800">ILLOW LIVE</span>
</div></div></nav>
<main class="max-w-7xl mx-auto px-4 pt-8">
<div class="flex flex-col md:flex-row gap-4 mb-8">
<input id="searchInput" class="flex-grow p-3 border rounded-xl shadow-sm" placeholder="Search matches, series, or teams...">
<div class="flex gap-2" id="filterContainer">
<button data-filter="ALL" class="filter-btn bg-slate-800 text-white px-5 py-2 rounded-xl text-xs font-bold">ALL</button>
<button data-filter="LIVE" class="filter-btn bg-white border px-5 py-2 rounded-xl text-xs font-bold">LIVE NOW</button>
<button data-filter="UPCOMING" class="filter-btn bg-white border px-5 py-2 rounded-xl text-xs font-bold">UPCOMING</button>
</div></div>
<div id="matchesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
<div class="col-span-full text-center py-16 text-emerald-600 font-bold">Loading Events...</div>
</div></main>
<div id="playerModal" class="player-modal-backdrop">
<div class="player-modal-content p-4 m-4">
<div class="flex justify-between items-center py-3 border-b">
<h2 id="modalTitle" class="font-bold"></h2>
<button onclick="closePlayer()" class="text-red-500 text-2xl">×</button>
</div>
<div class="w-full bg-black aspect-video rounded-lg my-4"><div id="jwplayer_div" class="w-full h-full"></div></div>
<h3 class="text-xs font-bold text-slate-500 mb-3">AVAILABLE SOURCES</h3>
<div id="serverList" class="flex flex-wrap gap-2"></div>
</div></div>
<script>
const JSON_URL="https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/live_sports.json";
let allMatches=[],currentFilter="ALL",searchQuery="",currentStreams=[],currentDrmKey="";
const grid=document.getElementById("matchesGrid");
async function fetchSportsData(){
try{const r=await fetch(JSON_URL,{cache:"no-store"});if(!r.ok)throw Error();const d=await r.json();allMatches=d.Matches||[];renderMatches()}
catch(e){grid.innerHTML='<div class="col-span-full text-center text-red-500 p-8">Error loading match feed.</div>'}}
function renderMatches(){
let filtered=allMatches.filter(m=>(currentFilter==="ALL"||(m.status||"").toUpperCase()===currentFilter)&&`${m.title} ${m.synopsis||""}`.toLowerCase().includes(searchQuery.toLowerCase()));
filtered.sort((a,b)=>(b.status==="LIVE")-(a.status==="LIVE"));
if(!filtered.length){grid.innerHTML='<div class="col-span-full text-center py-12">No matches available.</div>';return}
grid.innerHTML=filtered.map(m=>{
let live=(m.status||"").toUpperCase()==="LIVE",parts=(m.title||"").split(" - "),series=parts.length>1?parts[0]:"Cricket Match",title=parts.length>1?parts.slice(1).join(" - "):m.title;
return `<div class="match-card bg-white rounded-2xl border overflow-hidden flex flex-col shadow-sm">
<div class="relative aspect-video bg-slate-100">
<img src="${m.cover_image||'https://via.placeholder.com/600x338'}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/600x338'">
<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
<span class="absolute top-3 left-3 ${live?'bg-red-500':'bg-amber-400 text-slate-900'} text-white text-xs font-bold px-2 py-1 rounded-md">${live?'<span class="pulse-dot inline-block w-2 h-2 bg-white rounded-full mr-1"></span>LIVE':'◷ UPCOMING'}</span>
<span class="absolute top-3 right-3 bg-slate-900/80 text-white text-xs font-bold px-3 py-1.5 rounded-md">${m.time||'TBA'}</span>
</div>
<div class="p-4 flex flex-col flex-grow">
<div class="text-sm font-extrabold text-emerald-600 uppercase tracking-wide mb-2">${series}</div>
<h3 class="font-extrabold text-slate-800 text-lg leading-snug mb-3">${title}</h3>
<button onclick="openPlayer('${m.match_id}')" class="mt-auto w-full py-2.5 rounded-lg text-xs font-bold ${live?'bg-slate-800 text-white':'bg-slate-100 text-slate-700'}">${live?'WATCH LIVE':'VIEW INFO'}</button>
</div></div>`}).join("")}
document.getElementById("searchInput").addEventListener("input",e=>{searchQuery=e.target.value;renderMatches()});
document.querySelectorAll(".filter-btn").forEach(b=>b.onclick=()=>{currentFilter=b.dataset.filter;document.querySelectorAll(".filter-btn").forEach(x=>x.className="filter-btn bg-white border px-5 py-2 rounded-xl text-xs font-bold");b.className="filter-btn bg-slate-800 text-white px-5 py-2 rounded-xl text-xs font-bold";renderMatches()});
function openPlayer(id){
let m=allMatches.find(x=>String(x.match_id)===String(id));if(!m)return;
document.getElementById("modalTitle").textContent=m.title;currentStreams=[];currentDrmKey=m.drm_key||"";
for(let [g,obj] of [["Feed A",m.stream_url_alpha],["Feed B",m.stream_url_bravo]])if(obj)for(let [name,url] of Object.entries(obj))if(url)currentStreams.push({group:g,name,url});
document.getElementById("playerModal").style.display="flex";document.body.style.overflow="hidden";
buildServerList();if(currentStreams.length)startVideo(0);else document.getElementById("jwplayer_div").innerHTML='<div class="text-white p-8">No valid stream sources available.</div>'}
function buildServerList(active=0){document.getElementById("serverList").innerHTML=currentStreams.length?currentStreams.map((s,i)=>`<button onclick="startVideo(${i})" class="px-3 py-2 rounded border text-xs font-bold ${i===active?'bg-emerald-600 text-white':'bg-slate-50'}">${s.group} - ${s.name}</button>`).join(""):'No servers available.'}
function startVideo(i){
buildServerList(i);let config={file:currentStreams[i].url,width:"100%",height:"100%",autostart:true,stretching:"uniform",cast:{}};
if(currentDrmKey.includes(":")){let p=currentDrmKey.split(":");if(p.length===2){config.type="dash";config.drm={clearkey:{keyId:p[0].trim(),key:p[1].trim()}}}}
jwplayer("jwplayer_div").setup(config)}
function closePlayer(){try{jwplayer("jwplayer_div").remove()}catch(e){}document.getElementById("playerModal").style.display="none";document.body.style.overflow="auto"}
fetchSportsData();
</script>
</body>
</html>
